<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>아이콘 생성기</title>
  <style>
    body { font-family: sans-serif; padding: 24px; background: #f5f0e8; }
    canvas { display: none; }
    .btn { padding: 12px 24px; background: #4a7c59; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 8px; }
    .preview { display: flex; gap: 24px; margin: 24px 0; align-items: flex-end; }
    img { border: 1px solid #d4c9b0; border-radius: 12px; }
  </style>
</head>
<body>
  <h2>🌿 세컨하우스 일지 — 아이콘 생성기</h2>
  <p>아래 버튼을 클릭하면 아이콘 파일이 다운로드됩니다.<br>다운로드된 파일을 <code>icons/</code> 폴더에 저장하세요.</p>
  <div class="preview" id="preview"></div>
  <button class="btn" onclick="generate(192)">icon-192.png 다운로드</button>
  <button class="btn" onclick="generate(512)">icon-512.png 다운로드</button>
  <canvas id="canvas"></canvas>

  <script>
    function drawIcon(size) {
      const canvas = document.getElementById('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const r = size * 0.15;

      // Background rounded rect
      ctx.fillStyle = '#4a7c59';
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fill();

      // Emoji
      ctx.font = `${size * 0.55}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🌿', size / 2, size / 2 + size * 0.02);

      return canvas;
    }

    function generate(size) {
      const canvas = drawIcon(size);
      const link = document.createElement('a');
      link.download = `icon-${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Show previews
    window.onload = () => {
      const preview = document.getElementById('preview');
      [48, 192].forEach(size => {
        const canvas = drawIcon(size);
        const img = document.createElement('img');
        img.src = canvas.toDataURL();
        img.width = size;
        img.height = size;
        const wrap = document.createElement('div');
        wrap.style.textAlign = 'center';
        wrap.appendChild(img);
        wrap.appendChild(document.createElement('br'));
        const label = document.createElement('small');
        label.textContent = `${size}x${size}`;
        wrap.appendChild(label);
        preview.appendChild(wrap);
      });
    };
  </script>
</body>
</html>
