<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a3c2b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="세컨하우스 다이어리" />
  <meta name="description" content="세컨하우스·텃밭 방문 기록 앱" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>세컨하우스 다이어리</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:        #1e5c3a;
      --primary-mid:    #2d7a52;
      --primary-light:  #4a9e70;
      --primary-pale:   #e6f4ec;
      --primary-ultra:  #f0f8f3;
      --surface:        #ffffff;
      --surface2:       #f7faf8;
      --bg:             #eef4f0;
      --text:           #162d20;
      --text2:          #4a6b57;
      --text3:          #8aab96;
      --border:         #d6e8dc;
      --border2:        #eaf3ed;
      --amber:          #c47a12;
      --amber-bg:       #fef6e8;
      --amber-border:   #f5d49a;
      --red:            #c0392b;
      --red-bg:         #fdecea;
      --blue:           #1a6fa8;
      --shadow-xs:      0 1px 2px rgba(30,92,58,.06);
      --shadow-sm:      0 2px 8px rgba(30,92,58,.08), 0 1px 3px rgba(30,92,58,.04);
      --shadow-md:      0 4px 16px rgba(30,92,58,.12), 0 2px 6px rgba(30,92,58,.06);
      --shadow-lg:      0 8px 32px rgba(30,92,58,.16), 0 4px 12px rgba(30,92,58,.08);
      --shadow-modal:   0 -4px 40px rgba(0,0,0,.18);
      --r-xs:  6px;
      --r-sm:  10px;
      --r-md:  14px;
      --r-lg:  18px;
      --r-xl:  24px;
      --r-full: 999px;
      --font-display: 'DM Serif Display', serif;
      --font-body:    'Noto Sans KR', sans-serif;
      --header-h: 56px;
      --tabbar-h: 50px;
      --footer-h: 38px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    /* ═══════════════════════════════════════
       LOADING
    ═══════════════════════════════════════ */
    #loading-overlay {
      position: fixed; inset: 0;
      background: var(--primary);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
      gap: 20px;
    }
    #loading-overlay.hidden { display: none; }

    .loading-icon {
      width: 64px; height: 64px;
      background: rgba(255,255,255,.15);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .loading-icon svg { width: 36px; height: 36px; color: #fff; }

    .loading-spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-family: var(--font-display);
      font-size: 20px;
      color: rgba(255,255,255,.9);
      letter-spacing: .3px;
    }

    /* ═══════════════════════════════════════
       SCREENS
    ═══════════════════════════════════════ */
    .screen {
      position: fixed; inset: 0;
      display: none;
      flex-direction: column;
    }
    .screen.active { display: flex; }

    /* ═══════════════════════════════════════
       LOGIN SCREEN
    ═══════════════════════════════════════ */
    #login-screen {
      background: linear-gradient(160deg, #0f2e1c 0%, #1a4a2e 40%, #1e6040 70%, #245c3a 100%);
      align-items: center;
      justify-content: flex-end;
      padding: 0 0 env(safe-area-inset-bottom, 0);
    }

    .login-bg-deco {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .login-bg-deco::before {
      content: '';
      position: absolute;
      top: -30%;
      right: -20%;
      width: 70vw; height: 70vw;
      max-width: 340px; max-height: 340px;
      background: radial-gradient(circle, rgba(74,158,112,.25) 0%, transparent 70%);
      border-radius: 50%;
    }
    .login-bg-deco::after {
      content: '';
      position: absolute;
      bottom: 30%;
      left: -15%;
      width: 50vw; height: 50vw;
      max-width: 280px; max-height: 280px;
      background: radial-gradient(circle, rgba(255,255,255,.04) 0%, transparent 70%);
      border-radius: 50%;
    }

    .login-top {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 32px 32px;
      position: relative;
      z-index: 1;
    }

    .login-badge {
      width: 80px; height: 80px;
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
    }
    .login-badge svg {
      width: 44px; height: 44px;
      color: #fff;
    }

    .login-title {
      font-family: var(--font-display);
      font-size: 30px;
      color: #fff;
      text-align: center;
      margin-bottom: 10px;
      line-height: 1.2;
    }
    .login-subtitle {
      font-size: 14px;
      color: rgba(255,255,255,.65);
      text-align: center;
      line-height: 1.7;
    }

    .login-card {
      width: 100%;
      background: var(--surface);
      border-radius: 28px 28px 0 0;
      padding: 32px 24px calc(24px + env(safe-area-inset-bottom, 0));
      box-shadow: var(--shadow-modal);
      position: relative;
      z-index: 1;
    }

    .login-card-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 28px;
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 20px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r-md);
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all .18s ease;
      box-shadow: var(--shadow-sm);
    }
    .btn-google:active { transform: scale(.98); background: var(--surface2); }
    .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text3);
      font-size: 12px;
    }
    .login-divider::before, .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .btn-demo {
      width: 100%;
      padding: 14px 20px;
      background: var(--primary-ultra);
      border: 1.5px solid var(--primary-pale);
      border-radius: var(--r-md);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      color: var(--primary-mid);
      cursor: pointer;
      transition: all .18s ease;
    }
    .btn-demo:active { background: var(--primary-pale); }

    /* ═══════════════════════════════════════
       CONSENT SCREEN
    ═══════════════════════════════════════ */
    #consent-screen {
      background: var(--bg);
      padding: 0;
      justify-content: flex-end;
    }

    .consent-card {
      width: 100%;
      background: var(--surface);
      border-radius: 28px 28px 0 0;
      padding: 28px 20px calc(20px + env(safe-area-inset-bottom, 0));
      box-shadow: var(--shadow-modal);
    }

    .consent-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 24px;
    }

    .consent-title {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--text);
      margin-bottom: 6px;
    }
    .consent-desc {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 20px;
    }

    .consent-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--r-md);
      margin-bottom: 10px;
    }
    .consent-item input[type="checkbox"] {
      width: 20px; height: 20px;
      min-width: 20px;
      margin-top: 1px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .consent-item label {
      font-size: 13px;
      color: var(--text2);
      line-height: 1.6;
      cursor: pointer;
    }
    .consent-item label strong { color: var(--text); }
    .tag-required {
      display: inline-block;
      font-size: 10px; font-weight: 700;
      padding: 1px 6px;
      background: var(--red); color: #fff;
      border-radius: var(--r-full);
      margin-left: 6px; vertical-align: middle;
    }
    .tag-optional {
      display: inline-block;
      font-size: 10px; font-weight: 700;
      padding: 1px 6px;
      background: var(--text3); color: #fff;
      border-radius: var(--r-full);
      margin-left: 6px; vertical-align: middle;
    }

    .btn-consent {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 17px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--r-md);
      font-family: var(--font-body);
      font-size: 16px; font-weight: 700;
      cursor: pointer;
      transition: opacity .18s;
      box-shadow: 0 4px 12px rgba(30,92,58,.35);
    }
    .btn-consent:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

    /* ═══════════════════════════════════════
       MAIN SCREEN
    ═══════════════════════════════════════ */
    #main-screen {
      background: var(--bg);
      position: fixed; inset: 0;
    }

    /* Header */
    .app-header {
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-shadow: var(--shadow-xs);
      flex-shrink: 0;
      padding-top: env(safe-area-inset-top, 0);
      height: calc(var(--header-h) + env(safe-area-inset-top, 0));
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 34px; height: 34px;
      background: var(--primary);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(30,92,58,.3);
    }
    .header-icon svg { width: 18px; height: 18px; color: #fff; }

    .header-title {
      font-family: var(--font-display);
      font-size: 18px;
      color: var(--text);
      letter-spacing: -.2px;
    }

    .btn-settings {
      width: 38px; height: 38px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--text2);
      font-size: 17px;
      transition: all .15s;
    }
    .btn-settings:active { background: var(--border); }

    /* Tab bar */
    .tab-bar {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border2);
      height: var(--tabbar-h);
      flex-shrink: 0;
    }
    .tab-btn {
      flex: 1;
      height: 100%;
      background: none;
      border: none;
      font-family: var(--font-body);
      font-size: 13px; font-weight: 500;
      color: var(--text3);
      cursor: pointer;
      position: relative;
      transition: color .15s;
      display: flex; align-items: center; justify-content: center;
      gap: 5px;
    }
    .tab-btn.active { color: var(--primary); font-weight: 700; }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 20%; right: 20%;
      height: 2.5px;
      background: var(--primary);
      border-radius: 2px 2px 0 0;
    }

    /* Tab content */
    .tab-content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .tab-pane {
      position: absolute; inset: 0;
      overflow-y: auto;
      display: none;
      -webkit-overflow-scrolling: touch;
    }
    .tab-pane.active { display: block; }

    /* App footer */
    .app-footer {
      height: var(--footer-h);
      display: flex; align-items: center; justify-content: center;
      background: var(--surface);
      border-top: 1px solid var(--border2);
      font-size: 11px;
      color: var(--text3);
      flex-shrink: 0;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    /* ═══════════════════════════════════════
       CALENDAR TAB
    ═══════════════════════════════════════ */
    .calendar-container {
      padding: 16px 14px 20px;
    }

    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .month-nav-btn {
      width: 36px; height: 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      font-size: 18px; font-weight: 300;
      color: var(--text2);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-xs);
      transition: all .15s;
    }
    .month-nav-btn:active { background: var(--bg); }
    .month-label {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--text);
      letter-spacing: -.3px;
    }

    /* Calendar grid */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr) 3fr 3fr;
      gap: 3px;
    }

    .cal-header-cell {
      text-align: center;
      padding: 5px 2px 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text3);
      letter-spacing: .3px;
    }
    .cal-header-cell.sat { color: var(--blue); }
    .cal-header-cell.sun { color: var(--red); }

    .cal-cell {
      background: var(--surface);
      border: 1.5px solid var(--border2);
      border-radius: var(--r-sm);
      min-height: 52px;
      padding: 6px 5px 5px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
      position: relative;
      overflow: hidden;
    }
    .cal-cell.weekend {
      min-height: 84px;
      background: var(--surface);
    }
    .cal-cell.empty {
      background: transparent;
      border-color: transparent;
      cursor: default;
      box-shadow: none;
    }
    .cal-cell:not(.empty):active {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px var(--primary-pale);
    }
    .cal-cell.today {
      background: var(--primary-ultra);
      border-color: var(--primary-light);
    }
    .cal-cell.visited {
      border-color: var(--primary);
      border-width: 2px;
      box-shadow: var(--shadow-xs);
    }

    .cal-date {
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      line-height: 1;
    }
    .cal-cell.today .cal-date { color: var(--primary); }
    .cal-cell.visited .cal-date { color: var(--primary); }
    .cal-cell.sat .cal-date { color: var(--blue); }
    .cal-cell.sun .cal-date { color: var(--red); }

    .cal-visited-dot {
      position: absolute;
      top: 5px; right: 5px;
      width: 6px; height: 6px;
      background: var(--primary);
      border-radius: 50%;
    }

    .cal-expense {
      font-size: 9px;
      font-weight: 700;
      color: var(--amber);
      margin-top: 3px;
      line-height: 1;
    }

    .cal-memo {
      margin-top: 3px;
      font-size: 9px;
      line-height: 1.35;
      color: var(--text2);
      overflow: hidden;
      white-space: pre-line;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      word-break: break-all;
    }

    /* Month summary */
    .month-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }
    .summary-item {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--r-md);
      padding: 14px 10px;
      text-align: center;
      box-shadow: var(--shadow-xs);
    }
    .summary-value {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--primary);
      line-height: 1;
    }
    .summary-label {
      font-size: 11px;
      color: var(--text3);
      margin-top: 5px;
      font-weight: 500;
    }

    /* ═══════════════════════════════════════
       EXPENSE TAB
    ═══════════════════════════════════════ */
    .expense-container {
      padding: 16px 14px 20px;
    }

    .year-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .year-label {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--text);
    }

    .annual-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .annual-item {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--r-md);
      padding: 16px 12px;
      text-align: center;
      box-shadow: var(--shadow-xs);
    }
    .annual-value {
      font-family: var(--font-display);
      font-size: 26px;
      color: var(--primary);
      line-height: 1;
    }
    .annual-label {
      font-size: 11px;
      color: var(--text3);
      margin-top: 6px;
      font-weight: 500;
    }

    .chart-section {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--r-lg);
      padding: 18px 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-xs);
    }
    .chart-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text2);
      margin-bottom: 16px;
      letter-spacing: .2px;
    }

    .donut-wrapper {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .donut-svg-wrap { flex-shrink: 0; }
    .donut-legend {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .legend-label {
      flex: 1;
      font-size: 12px;
      color: var(--text2);
    }
    .legend-pct {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
    }

    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 100px;
      padding-bottom: 20px;
      position: relative;
    }
    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      position: relative;
    }
    .bar-fill-wrap {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: flex-end;
    }
    .bar-fill {
      width: 100%;
      background: var(--primary-pale);
      border-radius: 4px 4px 0 0;
      transition: height .3s ease;
      min-height: 3px;
      border: 1px solid var(--border);
      border-bottom: none;
    }
    .bar-fill.current-month {
      background: var(--primary);
      border-color: var(--primary-mid);
    }
    .bar-label {
      position: absolute;
      bottom: -18px;
      font-size: 9px;
      color: var(--text3);
      font-weight: 600;
    }

    /* ═══════════════════════════════════════
       MODAL
    ═══════════════════════════════════════ */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 500;
      backdrop-filter: blur(2px);
    }
    .modal-overlay.active { display: flex; align-items: flex-end; }

    .modal-sheet {
      width: 100%;
      max-height: 92vh;
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-modal);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    .modal-header {
      padding: 14px 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border2);
      flex-shrink: 0;
    }

    .modal-drag-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 14px;
    }

    .modal-title {
      font-family: var(--font-display);
      font-size: 17px;
      color: var(--text);

    /* ── Settings Modal ── */

    ═══════════════════════════════════════ */
    #toast {

      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0,0,0,.2);

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);

<script type="module">
// ─────────────────────────────────────────────
//  Firebase + Demo Mode Bootstrap
// ─────────────────────────────────────────────
const FIREBASE_VERSION = '10.7.1';
const FB_BASE = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;

let firebaseConfig = null;
try {
  const mod = await import('./firebase-config.js');
  firebaseConfig = mod.firebaseConfig;
} catch (e) {
  firebaseConfig = null;
}

let app, auth, db;
let initializeApp, getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged;
let getDatabase, dbRef, set, get, child;

function isPlaceholderConfig(cfg) {
  return !cfg || !cfg.apiKey || cfg.apiKey.startsWith('YOUR_') || cfg.projectId === 'YOUR_PROJECT_ID';
}
const demoMode = !firebaseConfig || isPlaceholderConfig(firebaseConfig);

if (!demoMode) {
  try {
    ({ initializeApp } = await import(FB_BASE + 'firebase-app.js'));
    ({ getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } =
      await import(FB_BASE + 'firebase-auth.js'));
    ({ getDatabase, ref: dbRef, set, get, child } =
      await import(FB_BASE + 'firebase-database.js'));
    app  = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db   = getDatabase(app);
  } catch (err) {
    console.warn('Firebase init failed, switching to demo mode:', err);
    firebaseConfig = null;
  }
}

// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let currentUser   = null;
let currentMonth  = new Date();
let currentYear   = new Date().getFullYear();
let allEntries    = {};
let userSettings  = { customTags: getDefaultTags(), plan: 'free' };
let selectedDate  = null;
let entryData     = {};
let deferredPrompt = null;

const CATEGORIES = ['시설유지','농업','식비','기타'];

// ─────────────────────────────────────────────
//  Default Tags
// ─────────────────────────────────────────────
function getDefaultTags() {
  return [
    { id: 'tag_001', emoji: '🌱', label: '텃밭',    order: 0 },
    { id: 'tag_002', emoji: '🔧', label: '시설관리', order: 1 },
    { id: 'tag_003', emoji: '🍽️', label: '식사',    order: 2 },
    { id: 'tag_004', emoji: '🧹', label: '기타',    order: 3 },
  ];
}

// ─────────────────────────────────────────────
//  Affiliate Map
// ─────────────────────────────────────────────
const TAG_AD_MAP = {
  '텃밭':    { label: '🛒 텃밭용품 보러가기',       url: 'https://bitl.bz/0bk0Rs' },
  '시설관리': { label: '🛒 공구·자재 보러가기',     url: 'https://bitl.bz/0bk0Rs' },
  '식사':    { label: '🛒 주방용품 보러가기',       url: 'https://bitl.bz/0bk0Rs' },
  '기타':    { label: '🛒 세컨하우스 용품 보러가기', url: 'https://bitl.bz/0bk0Rs' },
  '조경':    { label: '🛒 조경·정원 보러가기',      url: 'https://bitl.bz/0bk0Rs' },
  '수도':    { label: '🛒 관개·호스용품 보러가기',  url: 'https://bitl.bz/0bk0Rs' },
  'default': { label: '🛒 세컨하우스 용품 보러가기', url: 'https://bitl.bz/0bk0Rs' },
};

// ─────────────────────────────────────────────
//  Utility
// ─────────────────────────────────────────────
function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function parseDate(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function formatWon(amount) {
  if (amount >= 10000) return '₩' + (amount / 10000).toFixed(1) + '만';
  return '₩' + amount.toLocaleString();
}
function formatWonMan(amount) {
  return (amount / 10000).toFixed(1);
}
function getMondayOffset(date) {
  const day = date.getDay();
  return day === 0 ? 6 : day - 1;
}
function isWeekend(date) {
  const day = date.getDay();
  return day === 6 || day === 0;
}
function getEntryTotal(entry) {
  if (!entry || !entry.expenses) return 0;
  return entry.expenses.reduce((s, ex) => s + (Number(ex.amount) || 0), 0);
}
function uid() { return currentUser ? currentUser.uid : 'demo'; }

// ─────────────────────────────────────────────
//  Toast
// ─────────────────────────────────────────────
let toastTimer = null;
function showToast(msg, duration = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), duration);
}

// ─────────────────────────────────────────────
//  Screen Management
// ─────────────────────────────────────────────
function showScreen(id) {
  ['loading-overlay','login-screen','consent-screen','main-screen'].forEach(s => {
    const el = document.getElementById(s);
    if (!el) return;
    if (s === 'loading-overlay') el.classList.toggle('hidden', id !== s);
    else el.classList.toggle('active', s === id);
  });
}

// ─────────────────────────────────────────────
//  Data: Firebase or localStorage
// ─────────────────────────────────────────────
function lsKey(path) { return `shd_${path.replace(/\//g, '_')}`; }

async function dbGet(path) {
  if (demoMode || !db) {
    const raw = localStorage.getItem(lsKey(path));
    return raw ? JSON.parse(raw) : null;
  }
  try {
    const snap = await get(child(dbRef(db), path));
    return snap.exists() ? snap.val() : null;
  } catch (err) {
    const raw = localStorage.getItem(lsKey(path));
    return raw ? JSON.parse(raw) : null;
  }
}
async function dbSet(path, value) {
  if (demoMode || !db) { localStorage.setItem(lsKey(path), JSON.stringify(value)); return; }
  try {
    await set(dbRef(db, path), value);
  } catch (err) {
    localStorage.setItem(lsKey(path), JSON.stringify(value));
  }
}
async function loadAllEntries() {
  const data = await dbGet(`users/${uid()}/entries`);
  allEntries = data || {};
}
async function saveEntry(dateStr, entry) {
  allEntries[dateStr] = entry;
  await dbSet(`users/${uid()}/entries/${dateStr}`, entry);
}
async function loadSettings() {
  const data = await dbGet(`users/${uid()}/settings`);
  if (data) {
    userSettings = { ...userSettings, ...data };
    if (!userSettings.customTags) userSettings.customTags = getDefaultTags();
  }
}
async function saveSettings() { await dbSet(`users/${uid()}/settings`, userSettings); }
async function loadProfile() { return await dbGet(`users/${uid()}/profile`); }
async function saveProfile(profile) { await dbSet(`users/${uid()}/profile`, profile); }

// ─────────────────────────────────────────────
//  Auth Flow
// ─────────────────────────────────────────────
async function onUserReady(user) {
  currentUser = user;
  await loadSettings();
  await loadAllEntries();
  await loadNotices();
  const profile = await loadProfile();
  if (!profile || !profile.agreedAt) showScreen('consent-screen');
  else enterMainApp();
}

function enterMainApp() {
  showScreen('main-screen');
  renderCalendar();
  trackVisitAndMaybeShowInstall();
}

// ─────────────────────────────────────────────
//  PWA Install Prompt
// ─────────────────────────────────────────────
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });

function trackVisitAndMaybeShowInstall() {
  const visits = Number(localStorage.getItem('shd_visits') || 0) + 1;
  localStorage.setItem('shd_visits', visits);
  if (visits >= 3 && deferredPrompt) document.getElementById('install-banner').classList.add('visible');
}

document.getElementById('btn-pwa-install').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') showToast('홈화면에 추가되었어요! 📲');
  deferredPrompt = null;
  document.getElementById('install-banner').classList.remove('visible');
});
document.getElementById('btn-pwa-dismiss').addEventListener('click', () => {
  document.getElementById('install-banner').classList.remove('visible');
});

// ─────────────────────────────────────────────
//  Login Handlers
// ─────────────────────────────────────────────
document.getElementById('btn-google-login').addEventListener('click', async () => {
  if (demoMode) { currentUser = { uid: 'demo', displayName: '데모', email: '' }; await onUserReady(currentUser); return; }

  try {
    const provider = new GoogleAuthProvider();
    const result = await signInWithPopup(auth, provider);
    await onUserReady(result.user);
  } catch (err) {
    if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
    if (err.code === 'auth/popup-blocked') {
      showToast('팝업이 차단됐어요. 브라우저 설정에서 팝업을 허용해 주세요.');
    } else if (err.code === 'auth/operation-not-supported-in-this-environment') {
      showToast('이 브라우저에서는 로그인이 지원되지 않아요. Chrome 브라우저를 이용해 주세요.');
    } else {
      showToast('로그인에 실패했습니다. 다시 시도해 주세요.');
    }
  }
});


document.getElementById('btn-demo-login').addEventListener('click', async () => {
  currentUser = { uid: 'demo', displayName: '데모', email: '' };
  await onUserReady(currentUser);
});

// ─────────────────────────────────────────────
//  Consent Screen
// ─────────────────────────────────────────────
const consentRequired = document.getElementById('consent-required');
const consentOptional = document.getElementById('consent-optional');
const consentBtn = document.getElementById('btn-consent-submit');

  consentBtn.disabled = !(consentRequired.checked && consentOptional.checked);
}
consentRequired.addEventListener('change', updateConsentBtn);
consentOptional.addEventListener('change', updateConsentBtn);

document.getElementById('btn-consent-submit').addEventListener('click', async () => {
  await saveProfile({

// ─────────────────────────────────────────────
//  Tab Switching
// ─────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {

// ─────────────────────────────────────────────
//  Month Navigation
// ─────────────────────────────────────────────
document.getElementById('btn-prev-month').addEventListener('click', () => {
  currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1);

});

// ─────────────────────────────────────────────
//  Calendar Rendering
// ─────────────────────────────────────────────
function renderCalendar() {
  const y = currentMonth.getFullYear();
  const m = currentMonth.getMonth();
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('month-label').textContent = `${y}년 ${months[m]}`;

  const grid = document.getElementById('calendar-grid');
  grid.innerHTML = '';

  const days = ['월','화','수','목','금','토','일'];
  const dayClasses = ['','','','','','sat','sun'];
  days.forEach((d, i) => {
    const cell = document.createElement('div');
    cell.className = 'cal-header-cell' + (dayClasses[i] ? ' ' + dayClasses[i] : '');
    cell.textContent = d;
    grid.appendChild(cell);
  });

  const firstDay = new Date(y, m, 1);
  const lastDay  = new Date(y, m + 1, 0);
  const offset   = getMondayOffset(firstDay);
  const today    = formatDate(new Date());

  for (let i = 0; i < offset; i++) {
    const empty = document.createElement('div');
    empty.className = 'cal-cell empty';
    grid.appendChild(empty);
  }

  for (let d = 1; d <= lastDay.getDate(); d++) {
    const date = new Date(y, m, d);
    const dateStr = formatDate(date);
    const dayOfWeek = date.getDay();
    const weekend = isWeekend(date);
    const entry = allEntries[dateStr];
    const total = getEntryTotal(entry);
    const visited = entry && entry.visited;

    const cell = document.createElement('div');
    let cls = 'cal-cell';
    if (weekend) cls += ' weekend';
    if (dayOfWeek === 6) cls += ' sat';
    if (dayOfWeek === 0) cls += ' sun';
    if (dateStr === today) cls += ' today';
    if (visited) cls += ' visited';
    cell.className = cls;
    cell.dataset.date = dateStr;

    const dateEl = document.createElement('div');
    dateEl.className = 'cal-date';
    dateEl.textContent = d;
    cell.appendChild(dateEl);

    if (visited) {
      const dot = document.createElement('div');
      dot.className = 'cal-visited-dot';
      cell.appendChild(dot);
    }

    if (total > 0) {
      const expEl = document.createElement('div');
      expEl.className = 'cal-expense';
      expEl.textContent = formatWon(total);
      cell.appendChild(expEl);
    }

    if (entry && entry.memo) {
      const memoEl = document.createElement('div');
      memoEl.className = 'cal-memo';
      memoEl.textContent = entry.memo;
      cell.appendChild(memoEl);
    }

    cell.addEventListener('click', () => openEntryModal(dateStr));
    grid.appendChild(cell);
  }

  renderMonthSummary(y, m);
}

function renderMonthSummary(y, m) {
  const container = document.getElementById('month-summary');
  let visitDays = 0, totalExpense = 0, activityCount = 0;

  Object.entries(allEntries).forEach(([dateStr, entry]) => {
    const d = parseDate(dateStr);
    if (d.getFullYear() === y && d.getMonth() === m) {
      if (entry.visited) visitDays++;
      totalExpense += getEntryTotal(entry);
      if (entry.tags) activityCount += entry.tags.length;
    }
  });

  container.innerHTML = `
    <div class="summary-item">

      <div class="summary-label">방문일수</div>
    </div>

    <div class="summary-item">
      <div class="summary-value">${activityCount}</div>
      <div class="summary-label">활동건수</div>
    </div>
  `;
}

  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const weekDays = ['일','월','화','수','목','금','토'];
  document.getElementById('entry-modal-title').textContent =
    `${date.getFullYear()}년 ${months[date.getMonth()]} ${date.getDate()}일 (${weekDays[date.getDay()]})`;

});

function getLastYearEntries(dateStr) {
  const date = parseDate(dateStr);
  const lyDate = new Date(date.getFullYear() - 1, date.getMonth(), date.getDate());
  const results = [];
  const margin = 14 * 24 * 60 * 60 * 1000;

  Object.entries(allEntries).forEach(([ds, entry]) => {
    const d = parseDate(ds);
    if (d.getFullYear() !== lyDate.getFullYear()) return;
    if (Math.abs(d - lyDate) <= margin) {
      results.push({ dateStr: ds, entry, isExact: ds === formatDate(lyDate) });
    }
  });
  results.sort((a, b) => a.dateStr.localeCompare(b.dateStr));
  return results;
}

function renderDonutChart(catExpenses, total) {
  const wrapper = document.getElementById('donut-wrapper');
  wrapper.innerHTML = '';

  const entries = Object.entries(catExpenses);
  if (total === 0 || entries.length === 0) {
    wrapper.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:12px 0;">지출 데이터가 없습니다.</div>';
    return;
  }

  const size = 120, cx = 60, cy = 60, R = 46, r = 28;
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);

  function polarToXY(angle, radius) {
    const rad = (angle - 90) * Math.PI / 180;
    return { x: cx + radius * Math.cos(rad), y: cy + radius * Math.sin(rad) };
  }
  function makeArcPath(s, e, oR, iR) {
    const large = (e - s) > 180 ? 1 : 0;
    const o1 = polarToXY(s, oR), o2 = polarToXY(e, oR);
    const i1 = polarToXY(e, iR), i2 = polarToXY(s, iR);
    return `M ${o1.x} ${o1.y} A ${oR} ${oR} 0 ${large} 1 ${o2.x} ${o2.y} L ${i1.x} ${i1.y} A ${iR} ${iR} 0 ${large} 0 ${i2.x} ${i2.y} Z`;
  }

  let cumAngle = 0;
  const legend = document.createElement('div');
  legend.className = 'donut-legend';

  entries.forEach(([cat, amt]) => {
    const pct = amt / total;
    const angle = pct * 360;
    const color = CAT_COLORS[cat] || '#888';
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', makeArcPath(cumAngle, cumAngle + angle, R, r));
    path.setAttribute('fill', color);
    svg.appendChild(path);
    cumAngle += angle;

    const li = document.createElement('div');
    li.className = 'legend-item';
    li.innerHTML = `
      <div class="legend-dot" style="background:${color}"></div>
      <span class="legend-label">${cat}</span>
      <span class="legend-pct">${Math.round(pct * 100)}%</span>
    `;
    legend.appendChild(li);
  });

  const text = document.createElementNS(svgNS, 'text');
  text.setAttribute('x', cx); text.setAttribute('y', cy + 5);
  text.setAttribute('text-anchor', 'middle');
  text.setAttribute('font-size', '10');
  text.setAttribute('fill', 'var(--text3)');
  text.textContent = formatWon(total);
  svg.appendChild(text);

  const svgWrap = document.createElement('div');
  svgWrap.className = 'donut-svg-wrap';
  svgWrap.appendChild(svg);
  wrapper.appendChild(svgWrap);
  wrapper.appendChild(legend);
}

function renderBarChart(monthlyExpenses) {
  const container = document.getElementById('bar-chart');
  container.innerHTML = '';
  const maxAmt = Math.max(...monthlyExpenses, 1);
  const nowMonth = new Date().getMonth();
  const nowYear  = new Date().getFullYear();

  monthlyExpenses.forEach((amt, mi) => {
    const col = document.createElement('div');
    col.className = 'bar-col';
    const fillWrap = document.createElement('div');
    fillWrap.className = 'bar-fill-wrap';
    const fill = document.createElement('div');
    fill.className = 'bar-fill' + (mi === nowMonth && currentYear === nowYear ? ' current-month' : '');
    fill.style.height = Math.round((amt / maxAmt) * 100) + '%';
    fillWrap.appendChild(fill);
    const labelEl = document.createElement('div');
    labelEl.className = 'bar-label';
    labelEl.textContent = mi + 1;
    col.appendChild(fillWrap);
    col.appendChild(labelEl);
    container.appendChild(col);
  });
}

function exportCSV() {
  const BOM = '\uFEFF';
  const headers = ['날짜','방문여부','날씨','태그','메모','지출합계','지출항목'];
  const rows = [headers.join(',')];
  Object.entries(allEntries).sort(([a],[b]) => a.localeCompare(b)).forEach(([dateStr, entry]) => {
    const tags = (entry.tags || []).map(id => userSettings.customTags.find(t => t.id === id)).filter(Boolean).map(t => t.emoji + t.label).join('|');
    const expTotal = getEntryTotal(entry);
    const expItems = (entry.expenses || []).map(ex => `${ex.name}:${ex.amount}(${ex.category})`).join('|');
    rows.push([dateStr, entry.visited ? '방문' : '미방문', entry.weather || '', tags, (entry.memo || '').replace(/,/g, '，').replace(/\n/g, ' '), expTotal, expItems].map(v => `"${v}"`).join(','));
  });
  downloadBlob(new Blob([BOM + rows.join('\n')], { type: 'text/csv;charset=utf-8;' }), `secondhouse-diary-${formatDate(new Date())}.csv`);
  showToast('CSV 파일이 다운로드됩니다.');
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.addEventListener('change', async () => {
    const file = input.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data.entries || typeof data.entries !== 'object') {
        showToast('올바른 형식의 JSON 파일이 아니에요.'); return;
      }
      // Merge entries (imported data wins on conflict)
      allEntries = { ...allEntries, ...data.entries };
      // Merge settings if present
      if (data.settings) {
        if (data.settings.customTags) userSettings.customTags = data.settings.customTags;
        if (data.settings.plan) userSettings.plan = data.settings.plan;
      }
      await Promise.all([
        dbSet(`users/${currentUser.uid}/entries`, allEntries),
        saveSettings(),
      ]);
      renderCalendar();
      closeSettingsModal();
      showToast(`✅ ${Object.keys(data.entries).length}건의 일지를 가져왔어요!`);
    } catch (e) {
      showToast('파일을 읽는 중 오류가 발생했어요.');
    }
  });
  input.click();
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}

//  Notice Board
// ─────────────────────────────────────────────
const ADMIN_EMAIL = 'kjj0708@gmail.com';
let noticesData = {};

function isAdmin() {
  return currentUser && currentUser.email === ADMIN_EMAIL;
}

async function loadNotices() {
  try {
    if (!demoMode && db) {
      const snap = await get(child(dbRef(db), 'notices'));
      noticesData = snap.exists() ? snap.val() : {};
    } else {
      noticesData = {};
    }
  } catch (e) {
    noticesData = {};
  }
  renderNotices();
}

function renderNotices() {
  const list = document.getElementById('notice-list');
  const empty = document.getElementById('notice-empty');
  const writeBtn = document.getElementById('btn-write-notice');
  if (writeBtn) writeBtn.style.display = isAdmin() ? 'block' : 'none';

  const entries = Object.entries(noticesData)
    .sort(([,a],[,b]) => (b.pinned?1:0)-(a.pinned?1:0) || b.createdAt-a.createdAt);

  if (entries.length === 0) { empty.style.display='block'; list.innerHTML=''; return; }
  empty.style.display = 'none';

  list.innerHTML = entries.map(([id, n]) => `
    <div class="notice-card${n.pinned?' pinned':''}" id="nc-${id}">
      <div class="notice-card-header" onclick="toggleNotice('${id}')">
        ${n.pinned?'<span class="notice-pin-badge">📌 고정</span>':''}
        <div class="notice-title">${escapeHtml(n.title)}</div>
        <span class="notice-date-inline">${formatNoticeDate(n.createdAt)}</span>
        <svg class="notice-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="notice-body-wrap">
        <div class="notice-body">${escapeHtml(n.body)}</div>
        ${(n.images||[]).length ? `<div class="notice-images">${(n.images||[]).map((src,i)=>`<img class="notice-img" src="${src}" onclick="openLightbox('${id}',${i})" />`).join('')}</div>` : ''}
        ${isAdmin() ? `
        <div class="notice-admin-btns">
          <button class="btn-notice-edit" onclick="openEditNotice('${id}')">✏️ 수정</button>
          <button class="btn-notice-del" onclick="showDelConfirm('${id}')">🗑 삭제</button>
        </div>
        <div class="notice-del-confirm" id="del-confirm-${id}">
          <span>정말 삭제할까요?</span>
          <button class="btn-del-no" onclick="hideDelConfirm('${id}')">취소</button>
          <button class="btn-del-yes" onclick="deleteNotice('${id}')">삭제</button>
        </div>` : ''}
      </div>
    </div>
  `).join('');
}

function toggleNotice(id) {
  const card = document.getElementById('nc-'+id);
  if (card) card.classList.toggle('open');
}
function showDelConfirm(id) { document.getElementById('del-confirm-'+id)?.classList.add('show'); }
function hideDelConfirm(id) { document.getElementById('del-confirm-'+id)?.classList.remove('show'); }

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatNoticeDate(ts) {
  const d=new Date(ts);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

async function deleteNotice(id) {
  if (!isAdmin()) return;
  try {
    if (!demoMode && db) await set(dbRef(db, 'notices/'+id), null);
    delete noticesData[id];
    renderNotices();
    showToast('공지사항이 삭제됐어요.');
  } catch(e) { showToast('삭제에 실패했어요.'); }
}

// Image resize
function resizeImage(file, maxW=1200) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Modal state
let editingNoticeId = null;
let pendingImages = []; // base64 strings

function openNoticeModal(noticeId) {
  editingNoticeId = noticeId || null;
  pendingImages = [];
  const n = noticeId ? noticesData[noticeId] : null;
  document.getElementById('notice-modal-title').textContent = noticeId ? '공지사항 수정' : '공지사항 작성';
  document.getElementById('notice-title-input').value = n ? n.title : '';
  document.getElementById('notice-body-input').value = n ? n.body : '';
  document.getElementById('notice-pin-check').checked = n ? !!n.pinned : false;
  document.getElementById('btn-notice-submit').textContent = noticeId ? '수정 완료' : '등록';
  if (n && n.images) pendingImages = [...n.images];
  renderImgPreviews();
  document.getElementById('notice-modal-overlay').classList.remove('hidden');
}

function openEditNotice(id) { openNoticeModal(id); }

function renderImgPreviews() {
  const wrap = document.getElementById('notice-img-previews');
  wrap.innerHTML = pendingImages.map((src,i) => `
    <div class="notice-img-preview-wrap">
      <img src="${src}" />
      <button class="notice-img-remove" onclick="removeImg(${i})">✕</button>
    </div>
  `).join('');
}
function removeImg(i) { pendingImages.splice(i,1); renderImgPreviews(); }

document.getElementById('notice-img-input').addEventListener('change', async e => {
  const files = Array.from(e.target.files).slice(0, 3 - pendingImages.length);
  for (const f of files) {
    if (pendingImages.length >= 3) break;
    const b64 = await resizeImage(f);
    pendingImages.push(b64);
  }
  renderImgPreviews();
  e.target.value = '';
});

document.getElementById('btn-write-notice').addEventListener('click', () => openNoticeModal(null));
document.getElementById('btn-notice-cancel').addEventListener('click', () => {
  document.getElementById('notice-modal-overlay').classList.add('hidden');
});
document.getElementById('btn-notice-submit').addEventListener('click', async () => {
  const title = document.getElementById('notice-title-input').value.trim();
  const body = document.getElementById('notice-body-input').value.trim();
  const pinned = document.getElementById('notice-pin-check').checked;
  if (!title) { showToast('제목을 입력해 주세요.'); return; }
  if (!body) { showToast('내용을 입력해 주세요.'); return; }
  const id = editingNoticeId || ('notice_' + Date.now());
  const createdAt = editingNoticeId ? (noticesData[id]?.createdAt || Date.now()) : Date.now();
  const notice = { title, body, pinned, createdAt, images: pendingImages };
  try {
    if (!demoMode && db) await set(dbRef(db, 'notices/'+id), notice);
    noticesData[id] = notice;
    document.getElementById('notice-modal-overlay').classList.add('hidden');
    renderNotices();
    showToast(editingNoticeId ? '공지사항이 수정됐어요.' : '공지사항이 등록됐어요! 📢');
  } catch(e) { showToast('저장에 실패했어요.'); }
});

// Lightbox
const lightboxData = {};
function openLightbox(noticeId, idx) {
  const imgs = noticesData[noticeId]?.images || [];
  document.getElementById('img-lightbox-img').src = imgs[idx] || '';
  document.getElementById('img-lightbox').classList.remove('hidden');
}
document.getElementById('img-lightbox-close').addEventListener('click', () => {
  document.getElementById('img-lightbox').classList.add('hidden');
});
document.getElementById('img-lightbox').addEventListener('click', e => {
  if (e.target === e.currentTarget) document.getElementById('img-lightbox').classList.add('hidden');
});
