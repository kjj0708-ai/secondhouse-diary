<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a3c2b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="세컨하우스 다이어리" />
  <meta name="description" content="세컨하우스·텃밭 방문 기록 앱" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>세컨하우스 다이어리</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:        #1e5c3a;
      --primary-mid:    #2d7a52;
      --primary-light:  #4a9e70;
      --primary-pale:   #e6f4ec;
      --primary-ultra:  #f0f8f3;
      --surface:        #ffffff;
      --surface2:       #f7faf8;
      --bg:             #eef4f0;
      --text:           #162d20;
      --text2:          #4a6b57;
      --text3:          #8aab96;
      --border:         #d6e8dc;
      --border2:        #eaf3ed;
      --amber:          #c47a12;
      --amber-bg:       #fef6e8;
      --amber-border:   #f5d49a;
      --red:            #c0392b;
      --red-bg:         #fdecea;
      --blue:           #1a6fa8;
      --shadow-xs:      0 1px 2px rgba(30,92,58,.06);
      --shadow-sm:      0 2px 8px rgba(30,92,58,.08), 0 1px 3px rgba(30,92,58,.04);
      --shadow-md:      0 4px 16px rgba(30,92,58,.12), 0 2px 6px rgba(30,92,58,.06);
      --shadow-lg:      0 8px 32px rgba(30,92,58,.16), 0 4px 12px rgba(30,92,58,.08);
      --shadow-modal:   0 -4px 40px rgba(0,0,0,.18);
      --r-xs:  6px;
      --r-sm:  10px;
      --r-md:  14px;
      --r-lg:  18px;
      --r-xl:  24px;
      --r-full: 999px;
      --font-display: 'Noto Sans KR', sans-serif;
      --font-body:    'Noto Sans KR', sans-serif;
      --header-h: 56px;
      --tabbar-h: 50px;
      --footer-h: 38px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    /* ═══════════════════════════════════════
       LOADING
    ═══════════════════════════════════════ */
    #loading-overlay {
      position: fixed; inset: 0;
      background: var(--primary);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
      gap: 20px;
    }
    #loading-overlay.hidden { display: none; }

    .loading-icon {
      width: 64px; height: 64px;
      background: rgba(255,255,255,.15);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .loading-icon svg { width: 36px; height: 36px; color: #fff; }

    .loading-spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-family: var(--font-display);
      font-size: 20px;
      color: rgba(255,255,255,.9);
      letter-spacing: .3px;
    }

    /* ═══════════════════════════════════════
       SCREENS
    ═══════════════════════════════════════ */
    .screen {
      position: fixed; inset: 0;
      display: none;
      flex-direction: column;
    }
    .screen.active { display: flex; }

    /* ═══════════════════════════════════════
       LOGIN SCREEN
    ═══════════════════════════════════════ */
    #login-screen {
      background: linear-gradient(160deg, #0f2e1c 0%, #1a4a2e 40%, #1e6040 70%, #245c3a 100%);
      align-items: center;
      justify-content: flex-end;
      padding: 0 0 env(safe-area-inset-bottom, 0);
    }

    .login-bg-deco {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .login-bg-deco::before {
      content: '';
      position: absolute;
      top: -30%;
      right: -20%;
      width: 70vw; height: 70vw;
      max-width: 340px; max-height: 340px;
      background: radial-gradient(circle, rgba(74,158,112,.25) 0%, transparent 70%);
      border-radius: 50%;
    }
    .login-bg-deco::after {
      content: '';
      position: absolute;
      bottom: 30%;
      left: -15%;
      width: 50vw; height: 50vw;
      max-width: 280px; max-height: 280px;
      background: radial-gradient(circle, rgba(255,255,255,.04) 0%, transparent 70%);
      border-radius: 50%;
    }

    .login-top {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 32px 32px;
      position: relative;
      z-index: 1;
    }

    .login-badge {
      width: 80px; height: 80px;
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
    }
    .login-badge svg {
      width: 44px; height: 44px;
      color: #fff;
    }

    .login-title {
      font-family: var(--font-display);
      font-size: 30px;
      color: #fff;
      text-align: center;
      margin-bottom: 10px;
      line-height: 1.2;
    }
    .login-subtitle {
      font-size: 14px;
      color: rgba(255,255,255,.65);
      text-align: center;
      line-height: 1.7;
    }

    .login-card {
      width: 100%;
      background: var(--surface);
      border-radius: 28px 28px 0 0;
      padding: 32px 24px calc(24px + env(safe-area-inset-bottom, 0));
      box-shadow: var(--shadow-modal);
      position: relative;
      z-index: 1;
    }

    .login-card-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 28px;
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 20px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r-md);
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all .18s ease;
      box-shadow: var(--shadow-sm);
    }
    .btn-google:active { transform: scale(.98); background: var(--surface2); }
    .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text3);
      font-size: 12px;
    }
    .login-divider::before, .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .btn-demo {
      width: 100%;
      padding: 14px 20px;
      background: var(--primary-ultra);
      border: 1.5px solid var(--primary-pale);
      border-radius: var(--r-md);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      color: var(--primary-mid);
      cursor: pointer;
      transition: all .18s ease;
    }
    .btn-demo:active { background: var(--primary-pale); }

    /* ═══════════════════════════════════════
       CONSENT SCREEN
    ═══════════════════════════════════════ */
    #consent-screen {
      background: var(--bg);
      padding: 0;
      justify-content: flex-end;
    }

    .consent-card {
      width: 100%;
      background: var(--surface);
      border-radius: 28px 28px 0 0;
      padding: 28px 20px calc(20px + env(safe-area-inset-bottom, 0));
      box-shadow: var(--shadow-modal);
    }

    .consent-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 24px;
    }

    .consent-title {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--text);
      margin-bottom: 6px;
    }
    .consent-desc {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 20px;
    }

    .consent-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--r-md);
      margin-bottom: 10px;
    }
    .consent-item input[type="checkbox"] {
      width: 20px; height: 20px;
      min-width: 20px;
      margin-top: 1px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .consent-item label {
      font-size: 13px;
      color: var(--text2);
      line-height: 1.6;
      cursor: pointer;
    }
    .consent-item label strong { color: var(--text); }
    .tag-required {
      display: inline-block;
      font-size: 10px; font-weight: 700;
      padding: 1px 6px;
      background: var(--red); color: #fff;
      border-radius: var(--r-full);
      margin-left: 6px; vertical-align: middle;
    }
    .tag-optional {
      display: inline-block;
      font-size: 10px; font-weight: 700;
      padding: 1px 6px;
      background: var(--text3); color: #fff;
      border-radius: var(--r-full);
      margin-left: 6px; vertical-align: middle;
    }

    .btn-consent {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 17px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--r-md);
      font-family: var(--font-body);
      font-size: 16px; font-weight: 700;
      cursor: pointer;
      transition: opacity .18s;
      box-shadow: 0 4px 12px rgba(30,92,58,.35);
    }
    .btn-consent:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

    /* ═══════════════════════════════════════
       MAIN SCREEN
    ═══════════════════════════════════════ */
    #main-screen {
      background: var(--bg);
      position: fixed; inset: 0;
    }

    /* Header */
    .app-header {
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-shadow: var(--shadow-xs);
      flex-shrink: 0;
      padding-top: env(safe-area-inset-top, 0);
      height: calc(var(--header-h) + env(safe-area-inset-top, 0));
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 34px; height: 34px;
      background: var(--primary);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(30,92,58,.3);
    }
    .header-icon svg { width: 18px; height: 18px; color: #fff; }

    .header-title {
      font-family: var(--font-display);
      font-size: 18px;
      color: var(--text);
      letter-spacing: -.2px;
    }

    .btn-settings {
      width: 38px; height: 38px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--text2);
      font-size: 17px;
      transition: all .15s;
    }
    .btn-settings:active { background: var(--border); }

    /* Tab bar */
    .tab-bar {
      display: flex;
      background: var(--primary);
      border-bottom: none;
      height: var(--tabbar-h);
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(30,92,58,.25);
    }
    .tab-btn {
      flex: 1;
      height: 100%;
      background: none;
      border: none;
      font-family: var(--font-body);
      font-size: 12px; font-weight: 500;
      color: rgba(255,255,255,.6);
      cursor: pointer;
      position: relative;
      transition: color .15s;
      display: flex; align-items: center; justify-content: center;
      gap: 4px;
    }
    .tab-btn.active { color: #fff; font-weight: 700; }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 15%; right: 15%;
      height: 3px;
      background: rgba(255,255,255,.9);
      border-radius: 2px 2px 0 0;
    }

    /* Tab content */
    .tab-content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .tab-pane {
      position: absolute; inset: 0;
      overflow-y: auto;
      display: none;
      -webkit-overflow-scrolling: touch;
    }
    .tab-pane.active { display: block; }

    /* App footer */
    .app-footer {
      height: var(--footer-h);
      display: flex; align-items: center; justify-content: center;
      background: var(--surface);
      border-top: 1px solid var(--border2);
      font-size: 11px;
      color: var(--text3);
      flex-shrink: 0;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    /* ═══════════════════════════════════════
       CALENDAR TAB
    ═══════════════════════════════════════ */
    .calendar-container {
      padding: 16px 14px 20px;
    }

    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .month-nav-btn {
      width: 36px; height: 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      font-size: 18px; font-weight: 300;
      color: var(--text2);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-xs);
      transition: all .15s;
    }
    .month-nav-btn:active { background: var(--bg); }
    .month-label {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--text);
      letter-spacing: -.3px;
    }

    /* Calendar grid */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr) 3fr 3fr;
      gap: 3px;
    }

    .cal-header-cell {
      text-align: center;
      padding: 5px 2px 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text3);
      letter-spacing: .3px;
    }
    .cal-header-cell.sat { color: var(--blue); }
    .cal-header-cell.sun { color: var(--red); }

    .cal-cell {
      background: var(--surface);
      border: 1.5px solid var(--border2);
      border-radius: var(--r-sm);
      min-height: 52px;
      padding: 6px 5px 5px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
      position: relative;
      overflow: hidden;
    }
    .cal-cell.weekend {
      min-height: 84px;
      background: var(--surface);
    }
    .cal-cell.empty {
      background: transparent;
      border-color: transparent;
      cursor: default;
      box-shadow: none;
    }
    .cal-cell:not(.empty):active {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px var(--primary-pale);
    }
    .cal-cell.today {
      background: var(--primary-ultra);
      border-color: var(--primary-light);
    }
    .cal-cell.visited {
      border-color: var(--primary);
      border-width: 2px;
      box-shadow: var(--shadow-xs);
    }

    .cal-date {
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      line-height: 1;
    }
    .cal-cell.today .cal-date { color: var(--primary); }
    .cal-cell.visited .cal-date { color: var(--primary); }
    .cal-cell.sat .cal-date { color: var(--blue); }
    .cal-cell.sun .cal-date { color: var(--red); }

    .cal-visited-dot {
      position: absolute;
      top: 5px; right: 5px;
      width: 6px; height: 6px;
      background: var(--primary);
      border-radius: 50%;
    }

    .cal-expense {
      font-size: 9px;
      font-weight: 700;
      color: var(--amber);
      margin-top: 3px;
      line-height: 1;
    }

    .cal-memo {
      margin-top: 3px;
      font-size: 9px;
      line-height: 1.35;
      color: var(--text2);
      overflow: hidden;
      white-space: pre-line;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      word-break: break-all;
    }

    /* Month summary */
    .month-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }
    .summary-item {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--r-md);
      padding: 14px 10px;
      text-align: center;
      box-shadow: var(--shadow-xs);
    }
    .summary-value {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--primary);
      line-height: 1;
    }
    .summary-label {
      font-size: 11px;
      color: var(--text3);
      margin-top: 5px;
      font-weight: 500;
    }

    /* ═══════════════════════════════════════
       EXPENSE TAB
    ═══════════════════════════════════════ */
    .expense-container {
      padding: 16px 14px 20px;
    }

    .year-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .year-label {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--text);
    }

    .annual-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .annual-item {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--r-md);
      padding: 16px 12px;
      text-align: center;
      box-shadow: var(--shadow-xs);
    }
    .annual-value {
      font-family: var(--font-display);
      font-size: 26px;
      color: var(--primary);
      line-height: 1;
    }
    .annual-label {
      font-size: 11px;
      color: var(--text3);
      margin-top: 6px;
      font-weight: 500;
    }

    .chart-section {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--r-lg);
      padding: 18px 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-xs);
    }
    .chart-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text2);
      margin-bottom: 16px;
      letter-spacing: .2px;
    }

    .donut-wrapper {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .donut-svg-wrap { flex-shrink: 0; }
    .donut-legend {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .legend-label {
      flex: 1;
      font-size: 12px;
      color: var(--text2);
    }
    .legend-pct {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
    }

    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 130px;
      padding-bottom: 22px;
      position: relative;
    }
    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      position: relative;
    }
    .bar-pair {
      display: flex;
      align-items: flex-end;
      gap: 1px;
      width: 100%;
      flex: 1;
    }
    .bar-fill-wrap {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
    }
    .bar-fill {
      width: 100%;
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
      border-radius: 3px 3px 0 0;
      transition: height .3s ease;
      min-height: 3px;
      border-bottom: none;
    }
    .bar-fill.income-bar {
      background: var(--primary-pale);
      border-color: var(--primary-light);
    }
    .bar-fill.current-month { background: var(--amber); border-color: var(--amber); }
    .bar-fill.income-bar.current-month { background: var(--primary); border-color: var(--primary-mid); }
    .bar-num {
      font-size: 8px;
      font-weight: 700;
      white-space: nowrap;
      margin-bottom: 1px;
      line-height: 1;
    }
    .bar-num.expense-num { color: var(--amber); }
    .bar-num.income-num { color: var(--primary); }
    .bar-label {
      position: absolute;
      bottom: -18px;
      font-size: 9px;
      color: var(--text3);
      font-weight: 600;
    }
    .bar-chart-legend {
      display: flex; gap: 12px; justify-content: center;
      margin-top: 24px; margin-bottom: 4px;
      font-size: 11px; color: var(--text2);
    }
    .bar-chart-legend span { display: flex; align-items: center; gap: 4px; }
    .bar-chart-legend .dot {
      width: 10px; height: 10px; border-radius: 2px; display: inline-block;
    }

    /* Auto-link styles */
    .auto-link {
      color: var(--blue);
      text-decoration: underline;
      word-break: break-all;
    }
    .auto-link:visited { color: var(--blue); }

    /* ═══════════════════════════════════════
       MODAL
    ═══════════════════════════════════════ */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 500;
      backdrop-filter: blur(2px);
    }
    .modal-overlay.active { display: flex; align-items: flex-end; }

    .modal-sheet {
      width: 100%;
      max-height: 92vh;
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-modal);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    .modal-header {
      padding: 14px 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border2);
      flex-shrink: 0;
    }

    .modal-drag-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 14px;
    }

    .modal-title {
      font-family: var(--font-display);
      font-size: 17px;
      color: var(--text);
    }

    .btn-close {
      width: 30px; height: 30px;
      background: var(--bg);
      border: none;
      border-radius: var(--r-full);
      font-size: 14px;
      color: var(--text2);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .btn-close:active { background: var(--border); }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px 20px;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Entry Modal Sections ── */
    .lastyear-section {
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
      border-radius: var(--r-md);
      padding: 14px;
      margin-bottom: 20px;
    }
    .lastyear-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--amber);
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 10px;
    }
    .lastyear-empty {
      font-size: 13px;
      color: var(--text3);
    }
    .lastyear-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 0;
      font-size: 13px;
      color: var(--text2);
      border-top: 1px solid var(--amber-border);
    }
    .lastyear-item:first-of-type { border-top: none; }
    .lastyear-date {
      font-size: 12px;
      color: var(--amber);
      font-weight: 600;
      min-width: 36px;
    }
    .lastyear-item.highlight {
      background: rgba(196,122,18,.08);
      border-radius: var(--r-xs);
      padding: 7px 8px;
      margin: 0 -8px;
      border-top: none;
    }

    .entry-section {
      margin-bottom: 22px;
    }
    .entry-section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 10px;
    }

    /* Visit toggle */
    .toggle-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .toggle-btn {
      padding: 13px 12px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: var(--r-md);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      color: var(--text2);
      cursor: pointer;
      text-align: center;
      transition: all .15s;
    }
    .toggle-btn.selected {
      background: var(--primary-pale);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 700;
    }

    /* Weather */
    .weather-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .weather-btn {
      padding: 14px 8px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: var(--r-md);
      font-size: 24px;
      text-align: center;
      cursor: pointer;
      transition: all .15s;
      line-height: 1;
    }
    .weather-btn.selected {
      background: var(--primary-pale);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30,92,58,.1);
    }

    /* Tags */
    .tags-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag-btn {
      padding: 9px 16px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: var(--r-full);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      cursor: pointer;
      transition: all .15s;
    }
    .tag-btn.selected {
      background: var(--primary-pale);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 700;
    }

    /* Memo */
    .memo-textarea {
      width: 100%;
      min-height: 88px;
      padding: 13px 14px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: var(--r-md);
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--text);
      resize: none;
      outline: none;
      transition: border-color .15s;
      -webkit-appearance: none;
    }
    .memo-textarea:focus { border-color: var(--primary-light); }
    .memo-textarea::placeholder { color: var(--text3); }

    /* Expenses */
    .expense-list { display: flex; flex-direction: column; gap: 8px; }
    .expense-row {
      display: grid;
      grid-template-columns: 1fr 90px 80px 34px;
      gap: 6px;
      align-items: center;
    }
    .expense-input {
      padding: 11px 12px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text);
      outline: none;
      width: 100%;
      transition: border-color .15s;
      -webkit-appearance: none;
    }
    .expense-input:focus { border-color: var(--primary-light); }
    .expense-input::placeholder { color: var(--text3); }
    .expense-input[type="number"]::-webkit-inner-spin-button,
    .expense-input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

    .expense-select {
      padding: 11px 6px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--text);
      outline: none;
      cursor: pointer;
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      text-align: center;
    }
    .btn-delete-expense {
      width: 34px; height: 38px;
      background: var(--red-bg);
      border: 1.5px solid #f5c6c3;
      border-radius: var(--r-sm);
      font-size: 13px;
      color: var(--red);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .btn-add-expense {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      background: none;
      border: 1.5px dashed var(--border);
      border-radius: var(--r-md);
      font-size: 13px;
      font-family: var(--font-body);
      color: var(--text3);
      cursor: pointer;
      transition: all .15s;
    }
    .btn-add-expense:active { border-color: var(--primary); color: var(--primary); background: var(--primary-ultra); }

    /* Affiliate banner */
    .affiliate-banner {
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
      border-radius: var(--r-md);
      padding: 14px 16px;
      margin-bottom: 18px;
      text-align: center;
    }
    .affiliate-disclaimer {
      font-size: 10px;
      color: var(--text3);
      margin-bottom: 10px;
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .affiliate-disclaimer::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--amber);
      border-radius: 50%;
    }
    .affiliate-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 11px 22px;
      background: var(--amber);
      color: #fff;
      border-radius: var(--r-full);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: opacity .15s;
      box-shadow: 0 3px 10px rgba(196,122,18,.3);
    }
    .affiliate-link:active { opacity: .85; }

    /* Save button */
    .btn-save {
      width: 100%;
      padding: 17px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--r-md);
      font-family: var(--font-body);
      font-size: 16px; font-weight: 700;
      cursor: pointer;
      transition: opacity .18s;
      box-shadow: 0 4px 14px rgba(30,92,58,.35);
    }
    .btn-save:active { opacity: .9; }

    /* ── Settings Modal ── */
    .settings-section {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--r-md);
      padding: 16px;
      margin-bottom: 12px;
    }
    .settings-section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 12px;
    }

    .tag-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border2);
    }
    .tag-row:last-child { border-bottom: none; }
    .tag-row-info {
      flex: 1;
      font-size: 14px;
      color: var(--text);
    }
    .btn-tag-edit {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--r-xs);
      padding: 5px 10px;
      font-size: 11px; font-weight: 500;
      color: var(--text2);
      cursor: pointer;
      font-family: var(--font-body);
    }
    .btn-tag-delete {
      background: none;
      border: 1px solid var(--red);
      border-radius: var(--r-xs);
      padding: 5px 10px;
      font-size: 11px; font-weight: 500;
      color: var(--red);
      cursor: pointer;
      font-family: var(--font-body);
    }

    .add-tag-form {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 8px;
      margin-top: 12px;
    }
    .add-tag-form input {
      padding: 10px 12px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      font-size: 14px;
      font-family: var(--font-body);
      color: var(--text);
      outline: none;
      -webkit-appearance: none;
    }
    .add-tag-form input:focus { border-color: var(--primary-light); }
    .btn-add-tag {
      padding: 10px 16px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--r-sm);
      font-size: 13px; font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      font-family: var(--font-body);
    }
    .btn-add-tag:disabled { background: var(--border); cursor: not-allowed; }

    .export-btn {
      width: 100%;
      padding: 13px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      font-size: 13px;
      font-family: var(--font-body);
      color: var(--text);
      cursor: pointer;
      transition: background .15s;
      margin-bottom: 8px;
      text-align: left;
      display: flex; align-items: center;
      gap: 10px;
    }
    .export-btn:active { background: var(--bg); }

    .btn-logout {
      width: 100%;
      padding: 14px;
      background: none;
      border: 1.5px solid var(--red);
      border-radius: var(--r-md);
      font-size: 14px; font-weight: 700;
      font-family: var(--font-body);
      color: var(--red);
      cursor: pointer;
      transition: background .15s;
    }
    .btn-logout:active { background: var(--red-bg); }

    /* ═══════════════════════════════════════
       TOAST
    ═══════════════════════════════════════ */
    #toast {
      position: fixed;
      bottom: calc(60px + env(safe-area-inset-bottom, 0));
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: rgba(22,45,32,.92);
      color: #fff;
      padding: 11px 22px;
      border-radius: var(--r-full);
      font-size: 13px; font-weight: 500;
      z-index: 9999;
      opacity: 0;
      transition: opacity .25s, transform .25s;
      pointer-events: none;
      white-space: nowrap;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ═══════════════════════════════════════
       PWA INSTALL BANNER
    ═══════════════════════════════════════ */
    #install-banner {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--primary);
      color: #fff;
      padding: 14px 18px calc(14px + env(safe-area-inset-bottom, 0));
      display: none;
      align-items: center;
      gap: 12px;
      z-index: 400;
      box-shadow: 0 -4px 20px rgba(0,0,0,.15);
    }
    #install-banner.visible { display: flex; }
    .install-banner-text {
      flex: 1;
      font-size: 13px;
      line-height: 1.4;
    }
    .btn-install {
      background: #fff;
      color: var(--primary);
      border: none;
      border-radius: var(--r-sm);
      padding: 8px 16px;
      font-size: 12px; font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      font-family: var(--font-body);
    }
    .btn-install-dismiss {
      background: none; border: none;
      color: rgba(255,255,255,.6);
      font-size: 20px;
      cursor: pointer;
      padding: 2px;
      line-height: 1;
    }

    /* ═══════════════════════════════════════
       UTILITY
    ═══════════════════════════════════════ */
    .hidden { display: none !important; }

    /* ═══════════════════════════════════════
       NOTICE BOARD
    ═══════════════════════════════════════ */
    /* ═══ NOTICE BOARD ═══ */
    .notice-container { padding: 16px; padding-bottom: 80px; }
    .notice-card {
      background: var(--surface);
      border: 1.5px solid var(--border2);
      border-radius: var(--r-md);
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .notice-card.pinned { border-color: var(--primary-light); }
    .notice-card-header {
      display: flex; align-items: center; gap: 8px;
      padding: 14px 16px;
      cursor: pointer;
      user-select: none;
    }
    .notice-card-header:active { background: var(--surface2); }
    .notice-pin-badge {
      font-size: 10px; font-weight: 700;
      background: var(--primary); color: #fff;
      border-radius: var(--r-full); padding: 2px 7px;
      flex-shrink: 0;
    }
    .notice-title {
      font-size: 14px; font-weight: 600;
      color: var(--text); flex: 1; line-height: 1.4;
    }
    .notice-date-inline {
      font-size: 11px; color: var(--text3); flex-shrink: 0;
    }
    .notice-chevron {
      width: 16px; height: 16px; flex-shrink: 0;
      color: var(--text3); transition: transform .2s;
    }
    .notice-card.open .notice-chevron { transform: rotate(180deg); }
    .notice-body-wrap {
      display: none;
      padding: 0 16px 16px;
      border-top: 1px solid var(--border2);
    }
    .notice-card.open .notice-body-wrap { display: block; }
    .notice-body {
      font-size: 14px; color: var(--text2);
      line-height: 1.7; white-space: pre-line;
      padding-top: 12px;
    }
    .notice-images {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-top: 12px;
    }
    .notice-img {
      width: 100%; max-width: 100%;
      border-radius: var(--r-sm);
      object-fit: cover;
      cursor: pointer;
    }
    .notice-admin-btns {
      display: flex; gap: 8px;
      margin-top: 12px; padding-top: 10px;
      border-top: 1px solid var(--border2);
    }
    .btn-notice-edit {
      flex: 1; padding: 8px;
      border: 1.5px solid var(--primary-light);
      border-radius: var(--r-sm);
      background: var(--surface); color: var(--primary);
      font-size: 13px; font-weight: 600; font-family: var(--font-body);
      cursor: pointer;
    }
    .btn-notice-del {
      flex: 1; padding: 8px;
      border: 1.5px solid var(--red);
      border-radius: var(--r-sm);
      background: var(--surface); color: var(--red);
      font-size: 13px; font-weight: 600; font-family: var(--font-body);
      cursor: pointer;
    }
    .notice-del-confirm {
      display: none; margin-top: 8px;
      background: var(--red-bg); border-radius: var(--r-sm);
      padding: 10px 12px;
      font-size: 13px; color: var(--red);
    }
    .notice-del-confirm.show { display: flex; align-items: center; gap: 10px; }
    .notice-del-confirm span { flex: 1; }
    .btn-del-yes {
      background: var(--red); color: #fff;
      border: none; border-radius: 6px;
      padding: 5px 12px; font-size: 13px; cursor: pointer; font-family: var(--font-body);
    }
    .btn-del-no {
      background: none; color: var(--text2);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 12px; font-size: 13px; cursor: pointer; font-family: var(--font-body);
    }

    .btn-write-notice {
      position: fixed; bottom: calc(var(--tabbar-h) + 16px); right: 16px;
      background: var(--primary); color: #fff;
      border: none; border-radius: var(--r-full);
      padding: 13px 20px; font-size: 14px; font-weight: 700;
      font-family: var(--font-body); box-shadow: var(--shadow-md);
      cursor: pointer; z-index: 100;
    }
    .btn-write-notice:active { opacity: .85; }

    /* Notice Modal */
    .notice-modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 500; display: flex; align-items: flex-end;
    }
    .notice-modal-overlay.hidden { display: none; }
    .notice-modal {
      background: var(--surface); border-radius: 24px 24px 0 0;
      padding: 24px 20px 32px; width: 100%;
      max-height: 90vh; overflow-y: auto;
    }
    .notice-modal-title {
      font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 16px;
    }
    .notice-input {
      width: 100%; border: 1.5px solid var(--border);
      border-radius: var(--r-sm); padding: 12px;
      font-size: 14px; font-family: var(--font-body);
      color: var(--text); background: var(--surface);
      margin-bottom: 10px; box-sizing: border-box;
    }
    .notice-input:focus { outline: none; border-color: var(--primary); }
    .notice-textarea { resize: vertical; min-height: 120px; }
    .notice-img-upload-label {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px;
      border: 1.5px dashed var(--border);
      border-radius: var(--r-sm); cursor: pointer;
      font-size: 13px; color: var(--text2);
      margin-bottom: 10px;
    }
    .notice-img-upload-label:active { background: var(--surface2); }
    .notice-img-previews {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;
    }
    .notice-img-preview-wrap {
      position: relative; width: 80px; height: 80px;
    }
    .notice-img-preview-wrap img {
      width: 80px; height: 80px; object-fit: cover; border-radius: 8px;
    }
    .notice-img-remove {
      position: absolute; top: -6px; right: -6px;
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--red); color: #fff;
      border: none; font-size: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .notice-pin-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 14px; font-size: 14px; color: var(--text2);
    }
    .notice-modal-btns { display: flex; gap: 10px; }
    .btn-notice-cancel {
      flex: 1; padding: 13px;
      border: 1.5px solid var(--border); border-radius: var(--r-sm);
      background: var(--surface); font-size: 15px;
      font-family: var(--font-body); cursor: pointer; color: var(--text2);
    }
    .btn-notice-submit {
      flex: 2; padding: 13px; border: none;
      border-radius: var(--r-sm); background: var(--primary);
      color: #fff; font-size: 15px; font-weight: 700;
      font-family: var(--font-body); cursor: pointer;
    }
    .btn-notice-submit:active { opacity: .85; }

    /* Image lightbox */
    .img-lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,.9);
      z-index: 900; display: flex; align-items: center; justify-content: center;
    }
    .img-lightbox.hidden { display: none; }
    .img-lightbox img { max-width: 95vw; max-height: 90vh; border-radius: 8px; }
    .img-lightbox-close {
      position: absolute; top: 16px; right: 16px;
      background: rgba(255,255,255,.2); border: none;
      color: #fff; font-size: 22px; width: 40px; height: 40px;
      border-radius: 50%; cursor: pointer;
    }

    /* ═══════════════════════════════════════
       TAG FILTER BAR (Calendar)
    ═══════════════════════════════════════ */
    .tag-filter-bar {
      display: flex; gap: 8px; padding: 10px 14px 4px;
      overflow-x: auto; flex-shrink: 0;
      scrollbar-width: none;
    }
    .tag-filter-bar::-webkit-scrollbar { display: none; }
    .tag-filter-chip {
      flex-shrink: 0; padding: 5px 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--r-full);
      background: var(--surface); font-size: 12px; font-weight: 500;
      color: var(--text2); cursor: pointer; transition: all .15s;
      font-family: var(--font-body);
    }
    .tag-filter-chip.active {
      border-color: var(--primary); background: var(--primary);
      color: #fff;
    }
    .cal-cell.filtered-out {
      opacity: .3; pointer-events: none;
    }

    /* Tag memo fields */
    .tag-memo-container { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .tag-memo-hint { font-size: 12px; color: var(--text3); padding: 6px 0; }
    .tag-memo-row { display: flex; flex-direction: column; gap: 4px; }
    .tag-memo-label {
      font-size: 12px; font-weight: 700; color: var(--primary);
      padding: 4px 8px; background: var(--primary-pale);
      border-radius: var(--r-xs); display: inline-block;
    }
    .tag-memo-textarea {
      width: 100%; border: 1.5px solid var(--border);
      border-radius: var(--r-sm); padding: 8px 10px;
      font-size: 13px; font-family: var(--font-body); color: var(--text);
      background: var(--surface); resize: none; min-height: 64px;
    }
    .tag-memo-textarea:focus { outline: none; border-color: var(--primary); }

    /* ═══════════════════════════════════════
       INCOME in ENTRY MODAL
    ═══════════════════════════════════════ */
    .income-row { background: var(--primary-ultra); }
    .income-row .expense-select { background: var(--primary-pale); color: var(--primary); }

    /* ═══════════════════════════════════════
       SEARCH OVERLAY
    ═══════════════════════════════════════ */
    .search-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      z-index: 600; display: flex; align-items: flex-start; justify-content: center;
      padding-top: 60px;
    }
    .search-overlay.hidden { display: none; }
    .search-box {
      width: calc(100% - 32px); max-width: 480px;
      background: var(--surface); border-radius: var(--r-lg);
      box-shadow: var(--shadow-lg); overflow: hidden;
    }
    .search-input-row {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--border2);
    }
    .search-input-row svg { color: var(--text3); flex-shrink: 0; }
    .search-input {
      flex: 1; border: none; outline: none;
      font-size: 15px; font-family: var(--font-body); color: var(--text);
      background: transparent;
    }
    .search-close-btn {
      border: none; background: none; font-size: 16px; color: var(--text3);
      cursor: pointer; padding: 4px;
    }
    #search-results { max-height: 55vh; overflow-y: auto; }
    .search-result-item {
      padding: 12px 16px; border-bottom: 1px solid var(--border2);
      cursor: pointer; transition: background .15s;
    }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:active { background: var(--surface2); }
    .search-result-date { font-size: 12px; color: var(--primary); font-weight: 700; }
    .search-result-body { font-size: 13px; color: var(--text2); margin-top: 2px; }
    .search-no-result { padding: 24px 16px; text-align: center; color: var(--text3); font-size: 14px; }

    /* ═══════════════════════════════════════
       FARMING TAB
    ═══════════════════════════════════════ */
    .farming-container { padding: 14px; }
    .farming-region-bar {
      display: flex; gap: 8px; margin-bottom: 14px;
    }
    .region-btn {
      flex: 1; padding: 9px 0; border-radius: var(--r-sm);
      border: 1.5px solid var(--border); background: var(--surface);
      font-size: 14px; font-weight: 600; color: var(--text2);
      cursor: pointer; font-family: var(--font-body); transition: all .15s;
    }
    .region-btn.active {
      border-color: var(--primary); background: var(--primary); color: #fff;
    }
    .farming-month-card {
      background: var(--surface); border: 1px solid var(--border2);
      border-radius: var(--r-md); padding: 14px; margin-bottom: 10px;
    }
    .farming-month-title {
      font-size: 15px; font-weight: 700; color: var(--primary);
      margin-bottom: 8px;
    }
    .farming-items { display: flex; flex-direction: column; gap: 5px; }
    .farming-item {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 13px; color: var(--text2); line-height: 1.5;
    }
    .farming-item-badge {
      flex-shrink: 0; font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: var(--r-full);
      background: var(--primary-pale); color: var(--primary);
    }
    .farming-item-badge.harvest { background: #fef3e2; color: #c47a12; }
    .farming-item-badge.sow { background: #e6f4ec; color: var(--primary); }
    .farming-item-badge.plant { background: #e8f4ff; color: #1a6fa8; }
    .farming-item-badge.manage { background: #f3f0fb; color: #7c3aed; }

    /* ═══════════════════════════════════════
       ANNUAL ACTIVITY TAB
    ═══════════════════════════════════════ */
    .annual-act-container { padding: 14px; }
    .annual-act-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .annual-tag-select {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px;
    }
    .annual-tag-chip {
      padding: 5px 12px; border: 1.5px solid var(--border);
      border-radius: var(--r-full); font-size: 12px; font-weight: 500;
      color: var(--text2); cursor: pointer; background: var(--surface);
      font-family: var(--font-body); transition: all .15s;
    }
    .annual-tag-chip.active {
      border-color: var(--primary); background: var(--primary); color: #fff;
    }
    .annual-act-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .annual-month-card {
      background: var(--surface); border: 1px solid var(--border2);
      border-radius: var(--r-md); padding: 10px;
      min-height: 60px;
    }
    .annual-month-name {
      font-size: 12px; font-weight: 700; color: var(--primary);
      margin-bottom: 5px;
    }
    .annual-month-entry {
      font-size: 11px; color: var(--text2); line-height: 1.5;
      padding: 2px 0; border-bottom: 1px solid var(--border2);
    }
    .annual-month-entry:last-child { border-bottom: none; }
    .annual-month-empty {
      font-size: 11px; color: var(--text3);
    }

    /* ═══════════════════════════════════════
       BOARD / NOTICE TAB
    ═══════════════════════════════════════ */
    .board-subtab-bar {
      display: flex; background: var(--surface);
      border-bottom: 1px solid var(--border2);
      position: sticky; top: 0; z-index: 10;
    }
    .board-subtab-btn {
      flex: 1; padding: 12px 8px; border: none; background: none;
      font-size: 13px; font-weight: 600; color: var(--text3);
      cursor: pointer; font-family: var(--font-body);
      border-bottom: 2.5px solid transparent; transition: all .15s;
    }
    .board-subtab-btn.active {
      color: var(--primary); border-bottom-color: var(--primary);
    }

    /* ═══════════════════════════════════════
       REVIEWS
    ═══════════════════════════════════════ */
    .review-write-area {
      padding: 14px; border-bottom: 1px solid var(--border2);
    }
    .btn-write-review {
      width: 100%; padding: 12px;
      background: var(--primary); color: #fff;
      border: none; border-radius: var(--r-md);
      font-size: 14px; font-weight: 700; font-family: var(--font-body);
      cursor: pointer;
    }
    .btn-write-review:active { opacity: .85; }
    .review-card {
      padding: 14px 16px; border-bottom: 1px solid var(--border2);
      background: var(--surface);
    }
    .review-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px;
    }
    .review-author { font-size: 13px; font-weight: 700; color: var(--text); }
    .review-stars { color: #f59e0b; font-size: 15px; letter-spacing: 1px; }
    .review-body { font-size: 13px; color: var(--text2); line-height: 1.6; }
    .review-date { font-size: 11px; color: var(--text3); margin-top: 4px; }
    .review-del-btn {
      font-size: 11px; color: var(--red); background: none; border: none;
      cursor: pointer; padding: 2px 6px;
    }
    .star-rating-input {
      display: flex; gap: 8px; justify-content: center;
      margin-bottom: 14px; font-size: 32px; color: #d1d5db;
    }
    .star-btn { cursor: pointer; transition: color .1s; user-select: none; }
    .star-btn.selected, .star-btn.hover { color: #f59e0b; }

    /* ═══════════════════════════════════════
       INCOME IN ANALYSIS TAB
    ═══════════════════════════════════════ */
    .income-expense-row {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px;
    }
    .income-expense-row .ie-card { min-width: calc(33% - 8px); flex: 1; }
    .ie-card {
      flex: 1; background: var(--surface); border-radius: var(--r-md);
      padding: 12px 14px; border: 1.5px solid var(--border2);
    }
    .ie-card.income { border-color: #a3e4b7; }
    .ie-card.expense { border-color: var(--amber-border); }
    .ie-card-label { font-size: 11px; color: var(--text3); font-weight: 600; }
    .ie-card-value { font-size: 20px; font-weight: 700; margin-top: 4px; }
    .ie-card.income .ie-card-value { color: var(--primary); }
    .ie-card.expense .ie-card-value { color: var(--amber); }
  </style>
</head>

  <button class="btn-install" id="btn-pwa-install">추가</button>
  <button class="btn-install-dismiss" id="btn-pwa-dismiss">✕</button>
</div>

<script type="module">
// ─────────────────────────────────────────────
//  Firebase + Demo Mode Bootstrap
// ─────────────────────────────────────────────
const FIREBASE_VERSION = '10.7.1';
const FB_BASE = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;

let firebaseConfig = null;
try {
  const mod = await import('./firebase-config.js');
  firebaseConfig = mod.firebaseConfig;
} catch (e) {
  firebaseConfig = null;
}

let app, auth, db;
let initializeApp, getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged;
let getDatabase, dbRef, set, get, child, remove;

function isPlaceholderConfig(cfg) {
  return !cfg || !cfg.apiKey || cfg.apiKey.startsWith('YOUR_') || cfg.projectId === 'YOUR_PROJECT_ID';
}
const demoMode = !firebaseConfig || isPlaceholderConfig(firebaseConfig);

if (!demoMode) {
  try {
    ({ initializeApp } = await import(FB_BASE + 'firebase-app.js'));
    ({ getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } =
      await import(FB_BASE + 'firebase-auth.js'));
    ({ getDatabase, ref: dbRef, set, get, child, remove } =
      await import(FB_BASE + 'firebase-database.js'));
    app  = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db   = getDatabase(app);
  } catch (err) {
    console.warn('Firebase init failed, switching to demo mode:', err);
    firebaseConfig = null;
  }
}

// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let currentUser   = null;
let currentMonth  = new Date();
let currentYear   = new Date().getFullYear();
let allEntries    = {};
let userSettings  = { customTags: getDefaultTags(), plan: 'free', incomeCategories: ['농산물판매','시설임대료','기타'] };
let selectedDate  = null;
let entryData     = {};
let deferredPrompt = null;
let calTagFilter  = null;
let currentAnnualYear = new Date().getFullYear();
let annualActTag  = null;
let boardSubTab   = 'notice';
let farmingRegion = 'middle';
let reviewsData   = {};

const CATEGORIES = ['시설유지','농업','식비','기타'];

function getEntryIncome(entry) {
  if (!entry || !entry.incomes) return 0;
  return entry.incomes.reduce((s, inc) => s + (Number(inc.amount) || 0), 0);
}

// ─────────────────────────────────────────────
//  Default Tags
// ─────────────────────────────────────────────
function getDefaultTags() {
  return [
    { id: 'tag_001', emoji: '🌱', label: '텃밭',    order: 0 },
    { id: 'tag_002', emoji: '🔧', label: '시설관리', order: 1 },
    { id: 'tag_003', emoji: '🍽️', label: '식사',    order: 2 },
    { id: 'tag_004', emoji: '🧹', label: '기타',    order: 3 },
  ];
}

// ─────────────────────────────────────────────
//  Affiliate Map
// ─────────────────────────────────────────────
const TAG_AD_MAP = {
  '텃밭':    { label: '🛒 텃밭용품 보러가기',       url: 'https://bitl.bz/0bk0Rs' },
  '시설관리': { label: '🛒 공구·자재 보러가기',     url: 'https://bitl.bz/0bk0Rs' },
  '식사':    { label: '🛒 주방용품 보러가기',       url: 'https://bitl.bz/0bk0Rs' },
  '기타':    { label: '🛒 세컨하우스 용품 보러가기', url: 'https://bitl.bz/0bk0Rs' },
  '조경':    { label: '🛒 조경·정원 보러가기',      url: 'https://bitl.bz/0bk0Rs' },
  '수도':    { label: '🛒 관개·호스용품 보러가기',  url: 'https://bitl.bz/0bk0Rs' },
  'default': { label: '🛒 세컨하우스 용품 보러가기', url: 'https://bitl.bz/0bk0Rs' },
};

// ─────────────────────────────────────────────
//  Utility
// ─────────────────────────────────────────────
function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function parseDate(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function formatWon(amount) {
  if (amount >= 10000) return '₩' + (amount / 10000).toFixed(1) + '만';
  return '₩' + amount.toLocaleString();
}
function formatWonMan(amount) {
  return (amount / 10000).toFixed(1);
}
function getMondayOffset(date) {
  const day = date.getDay();
  return day === 0 ? 6 : day - 1;
}
function isWeekend(date) {
  const day = date.getDay();
  return day === 6 || day === 0;
}
function getEntryTotal(entry) {
  if (!entry || !entry.expenses) return 0;
  return entry.expenses.reduce((s, ex) => s + (Number(ex.amount) || 0), 0);
}
function uid() { return currentUser ? currentUser.uid : 'demo'; }

// ─────────────────────────────────────────────
//  Toast
// ─────────────────────────────────────────────
let toastTimer = null;
function showToast(msg, duration = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), duration);
}

// ─────────────────────────────────────────────
//  Screen Management
// ─────────────────────────────────────────────
function showScreen(id) {
  ['loading-overlay','login-screen','consent-screen','main-screen'].forEach(s => {
    const el = document.getElementById(s);
    if (!el) return;
    if (s === 'loading-overlay') el.classList.toggle('hidden', id !== s);
    else el.classList.toggle('active', s === id);
  });
}

// ─────────────────────────────────────────────
//  Data: Firebase or localStorage
// ─────────────────────────────────────────────
function lsKey(path) { return `shd_${path.replace(/\//g, '_')}`; }

async function dbGet(path) {
  if (demoMode || !db) {
    const raw = localStorage.getItem(lsKey(path));
    return raw ? JSON.parse(raw) : null;
  }
  try {
    const snap = await get(child(dbRef(db), path));
    return snap.exists() ? snap.val() : null;
  } catch (err) {
    const raw = localStorage.getItem(lsKey(path));
    return raw ? JSON.parse(raw) : null;
  }
}
async function dbSet(path, value) {
  if (demoMode || !db) { localStorage.setItem(lsKey(path), JSON.stringify(value)); return; }
  try {
    await set(dbRef(db, path), value);
  } catch (err) {
    localStorage.setItem(lsKey(path), JSON.stringify(value));
  }
}
async function loadAllEntries() {
  const data = await dbGet(`users/${uid()}/entries`);
  allEntries = data || {};
}
async function saveEntry(dateStr, entry) {
  allEntries[dateStr] = entry;
  await dbSet(`users/${uid()}/entries/${dateStr}`, entry);
}
async function loadSettings() {
  const data = await dbGet(`users/${uid()}/settings`);
  if (data) {
    userSettings = { ...userSettings, ...data };
    if (!userSettings.customTags) userSettings.customTags = getDefaultTags();
    if (!userSettings.incomeCategories) userSettings.incomeCategories = ['농산물판매','시설임대료','기타'];
    // customFarming is loaded as-is (may be undefined)
  }
}
async function saveSettings() { await dbSet(`users/${uid()}/settings`, userSettings); }
async function loadProfile() { return await dbGet(`users/${uid()}/profile`); }
async function saveProfile(profile) { await dbSet(`users/${uid()}/profile`, profile); }

// ─────────────────────────────────────────────
//  Auth Flow
// ─────────────────────────────────────────────
async function onUserReady(user) {
  currentUser = user;
  await loadSettings();
  await loadAllEntries();
  await loadNotices();
  await loadReviews();
  const profile = await loadProfile();
  if (!profile || !profile.agreedAt) showScreen('consent-screen');
  else enterMainApp();
}

function enterMainApp() {
  showScreen('main-screen');
  renderCalendar();
  trackVisitAndMaybeShowInstall();
}

// ─────────────────────────────────────────────
//  PWA Install Prompt
// ─────────────────────────────────────────────
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });

function trackVisitAndMaybeShowInstall() {
  const visits = Number(localStorage.getItem('shd_visits') || 0) + 1;
  localStorage.setItem('shd_visits', visits);
  if (visits >= 3 && deferredPrompt) document.getElementById('install-banner').classList.add('visible');
}

document.getElementById('btn-pwa-install').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') showToast('홈화면에 추가되었어요! 📲');
  deferredPrompt = null;
  document.getElementById('install-banner').classList.remove('visible');
});
document.getElementById('btn-pwa-dismiss').addEventListener('click', () => {
  document.getElementById('install-banner').classList.remove('visible');
});

// ─────────────────────────────────────────────
//  Login Handlers
// ─────────────────────────────────────────────
document.getElementById('btn-google-login').addEventListener('click', async () => {
  if (demoMode) { currentUser = { uid: 'demo', displayName: '데모', email: '' }; await onUserReady(currentUser); return; }

  try {
    const provider = new GoogleAuthProvider();
    const result = await signInWithPopup(auth, provider);
    await onUserReady(result.user);
  } catch (err) {
    if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
    if (err.code === 'auth/popup-blocked') {
      showToast('팝업이 차단됐어요. 브라우저 설정에서 팝업을 허용해 주세요.');
    } else if (err.code === 'auth/operation-not-supported-in-this-environment') {
      showToast('이 브라우저에서는 로그인이 지원되지 않아요. Chrome 브라우저를 이용해 주세요.');
    } else {
      showToast('로그인에 실패했습니다. 다시 시도해 주세요.');
    }
  }
});


document.getElementById('btn-demo-login').addEventListener('click', async () => {
  currentUser = { uid: 'demo', displayName: '데모', email: '' };
  await onUserReady(currentUser);
});

// ─────────────────────────────────────────────
//  Consent Screen
// ─────────────────────────────────────────────

const consentOptional = document.getElementById('consent-optional');
const consentBtn = document.getElementById('btn-consent-submit');

}
consentRequired.addEventListener('change', updateConsentBtn);
consentOptional.addEventListener('change', updateConsentBtn);

document.getElementById('btn-consent-submit').addEventListener('click', async () => {
  await saveProfile({
    displayName: currentUser.displayName || '',

// ─────────────────────────────────────────────

// ─────────────────────────────────────────────
//  Month Navigation
// ─────────────────────────────────────────────
document.getElementById('btn-prev-month').addEventListener('click', () => {
  currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1);
  renderCalendar();
});
document.getElementById('btn-next-month').addEventListener('click', () => {
  currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1);

// ─────────────────────────────────────────────
//  Calendar Rendering
// ─────────────────────────────────────────────
function renderTagFilterBar() {
  const bar = document.getElementById('tag-filter-bar');
  if (!bar) return;
  bar.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'tag-filter-chip' + (calTagFilter === null ? ' active' : '');
  allChip.textContent = '전체';
  allChip.addEventListener('click', () => { calTagFilter = null; renderCalendar(); });
  bar.appendChild(allChip);
  userSettings.customTags.sort((a,b) => a.order - b.order).forEach(tag => {
    const chip = document.createElement('button');
    chip.className = 'tag-filter-chip' + (calTagFilter === tag.id ? ' active' : '');
    chip.textContent = tag.emoji + ' ' + tag.label;
    chip.addEventListener('click', () => {
      calTagFilter = calTagFilter === tag.id ? null : tag.id;
      renderCalendar();
    });
    bar.appendChild(chip);
  });
}

function renderCalendar() {
  renderTagFilterBar();
  const y = currentMonth.getFullYear();
  const m = currentMonth.getMonth();
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('month-label').textContent = `${y}년 ${months[m]}`;

  const grid = document.getElementById('calendar-grid');
  grid.innerHTML = '';

  const days = ['월','화','수','목','금','토','일'];
  const dayClasses = ['','','','','','sat','sun'];
  days.forEach((d, i) => {
    const cell = document.createElement('div');
    cell.className = 'cal-header-cell' + (dayClasses[i] ? ' ' + dayClasses[i] : '');
    cell.textContent = d;
    grid.appendChild(cell);
  });

  const firstDay = new Date(y, m, 1);
  const lastDay  = new Date(y, m + 1, 0);
  const offset   = getMondayOffset(firstDay);
  const today    = formatDate(new Date());

  for (let i = 0; i < offset; i++) {
    const empty = document.createElement('div');
    empty.className = 'cal-cell empty';
    grid.appendChild(empty);
  }

  for (let d = 1; d <= lastDay.getDate(); d++) {
    const date = new Date(y, m, d);
    const dateStr = formatDate(date);
    const dayOfWeek = date.getDay();
    const weekend = isWeekend(date);
    const entry = allEntries[dateStr];
    const total = getEntryTotal(entry);
    const visited = entry && entry.visited;

    const cell = document.createElement('div');
    let cls = 'cal-cell';
    if (weekend) cls += ' weekend';
    if (dayOfWeek === 6) cls += ' sat';
    if (dayOfWeek === 0) cls += ' sun';
    if (dateStr === today) cls += ' today';
    if (visited) cls += ' visited';
    if (calTagFilter && !(entry && entry.tags && entry.tags.includes(calTagFilter))) cls += ' filtered-out';
    cell.className = cls;
    cell.dataset.date = dateStr;

    const dateEl = document.createElement('div');
    dateEl.className = 'cal-date';
    dateEl.textContent = d;
    cell.appendChild(dateEl);

    if (visited) {
      const dot = document.createElement('div');
      dot.className = 'cal-visited-dot';
      cell.appendChild(dot);
    }

    if (total > 0) {
      const expEl = document.createElement('div');
      expEl.className = 'cal-expense';
      expEl.textContent = formatWon(total);
      cell.appendChild(expEl);
    }

    // tagMemos: show each tag's memo in the cell
    if (entry && entry.tagMemos && Object.keys(entry.tagMemos).length) {
      const tagMemoEl = document.createElement('div');
      tagMemoEl.className = 'cal-memo';
      const lines = (entry.tags || [])
        .map(id => {
          const t = userSettings.customTags.find(t => t.id === id);
          const m = entry.tagMemos[id];
          return (t && m) ? `${t.emoji} ${m}` : null;
        })
        .filter(Boolean);
      if (lines.length) {
        tagMemoEl.innerHTML = lines.map(l => linkifyText(l)).join('<br>');
        cell.appendChild(tagMemoEl);
      }
    } else if (entry && entry.memo) {
      const memoEl = document.createElement('div');
      memoEl.className = 'cal-memo';
      memoEl.innerHTML = linkifyText(entry.memo);
      cell.appendChild(memoEl);
    }

    cell.addEventListener('click', () => openEntryModal(dateStr));
    grid.appendChild(cell);
  }

  renderMonthSummary(y, m);
}

function renderMonthSummary(y, m) {
  const container = document.getElementById('month-summary');
  let visitDays = 0, totalExpense = 0, activityCount = 0;

  Object.entries(allEntries).forEach(([dateStr, entry]) => {
    const d = parseDate(dateStr);
    if (d.getFullYear() === y && d.getMonth() === m) {
      if (entry.visited) visitDays++;
      totalExpense += getEntryTotal(entry);
      if (entry.tags) activityCount += entry.tags.length;
    }
  });

  container.innerHTML = `
    <div class="summary-item">
      <div class="summary-value">${visitDays}</div>
      <div class="summary-label">방문일수</div>
    </div>
    <div class="summary-item">
      <div class="summary-value">${formatWonMan(totalExpense)}</div>
      <div class="summary-label">월지출(만원)</div>
    </div>
    <div class="summary-item">
      <div class="summary-value">${activityCount}</div>
      <div class="summary-label">활동건수</div>
    </div>
  `;
}

// ─────────────────────────────────────────────
//  Entry Modal
// ─────────────────────────────────────────────
function openEntryModal(dateStr) {
  selectedDate = dateStr;
  const existing = allEntries[dateStr] || {};
  entryData = {
    visited: existing.visited ?? true,
    weather: existing.weather || '',
    tags: existing.tags ? [...existing.tags] : [],
    memo: existing.memo || '',
    tagMemos: existing.tagMemos ? {...existing.tagMemos} : {},
    expenses: existing.expenses ? JSON.parse(JSON.stringify(existing.expenses)) : [],
    incomes: existing.incomes ? JSON.parse(JSON.stringify(existing.incomes)) : [],
  };

  const date = parseDate(dateStr);
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const weekDays = ['일','월','화','수','목','금','토'];
  document.getElementById('entry-modal-title').textContent =
    `${date.getFullYear()}년 ${months[date.getMonth()]} ${date.getDate()}일 (${weekDays[date.getDay()]})`;

  renderEntryModalBody();
  document.getElementById('entry-modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeEntryModal() {
  document.getElementById('entry-modal').classList.remove('active');
  document.body.style.overflow = '';
  selectedDate = null;
  entryData = {};
}

document.getElementById('btn-close-entry').addEventListener('click', closeEntryModal);
document.getElementById('entry-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('entry-modal')) closeEntryModal();
});

function getLastYearEntries(dateStr) {
  const date = parseDate(dateStr);
  const lyDate = new Date(date.getFullYear() - 1, date.getMonth(), date.getDate());
  const results = [];
  const margin = 14 * 24 * 60 * 60 * 1000;

  Object.entries(allEntries).forEach(([ds, entry]) => {
    const d = parseDate(ds);
    if (d.getFullYear() !== lyDate.getFullYear()) return;
    if (Math.abs(d - lyDate) <= margin) {
      results.push({ dateStr: ds, entry, isExact: ds === formatDate(lyDate) });
    }
  });
  results.sort((a, b) => a.dateStr.localeCompare(b.dateStr));
  return results;
}

function renderEntryModalBody() {
  const body = document.getElementById('entry-modal-body');
  body.innerHTML = '';

  // 작년 이맘때
  const lyEntries = getLastYearEntries(selectedDate);
  const lySection = document.createElement('div');
  lySection.className = 'lastyear-section';
  lySection.innerHTML = `<div class="lastyear-title">📅 작년 이맘때</div>`;
  if (lyEntries.length === 0) {
    lySection.innerHTML += `<div class="lastyear-empty">작년 이 시기의 기록이 없어요.</div>`;
  } else {
    lyEntries.forEach(({ dateStr, entry, isExact }) => {
      const d = parseDate(dateStr);
      const item = document.createElement('div');
      item.className = 'lastyear-item' + (isExact ? ' highlight' : '');
      const tags = userSettings.customTags
        .filter(t => (entry.tags||[]).includes(t.id))
        .map(t => t.emoji).join(' ');
      item.innerHTML = `<span class="lastyear-date">${d.getMonth()+1}/${d.getDate()}</span>
        ${entry.visited ? '✅' : '❌'} ${tags} ${entry.memo ? '· ' + linkifyText(entry.memo.slice(0,60)) : ''}`;
      lySection.appendChild(item);
    });
  }
  body.appendChild(lySection);

  // 방문여부
  const visitSection = document.createElement('div');
  visitSection.className = 'entry-section';
  visitSection.innerHTML = `<div class="entry-section-title">방문 여부</div>`;
  const visitGroup = document.createElement('div');
  visitGroup.className = 'toggle-group';
  [['🏡 방문했어요', true], ['🚗 미방문', false]].forEach(([label, val]) => {
    const btn = document.createElement('button');
    btn.className = 'toggle-btn' + (entryData.visited === val ? ' selected' : '');
    btn.textContent = label;
    btn.addEventListener('click', () => {
      entryData.visited = val;
      visitGroup.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
    visitGroup.appendChild(btn);
  });
  visitSection.appendChild(visitGroup);
  body.appendChild(visitSection);

  // 날씨
  const weatherSection = document.createElement('div');
  weatherSection.className = 'entry-section';
  weatherSection.innerHTML = `<div class="entry-section-title">날씨</div>`;
  const weatherGroup = document.createElement('div');
  weatherGroup.className = 'weather-group';
  [['☀️','맑음'],['🌤️','구름'],['🌧️','비'],['❄️','눈']].forEach(([emoji, label]) => {
    const btn = document.createElement('button');
    btn.className = 'weather-btn' + (entryData.weather === emoji ? ' selected' : '');
    btn.textContent = emoji;
    btn.title = label;
    btn.addEventListener('click', () => {
      entryData.weather = entryData.weather === emoji ? '' : emoji;
      weatherGroup.querySelectorAll('.weather-btn').forEach(b => b.classList.remove('selected'));
      if (entryData.weather) btn.classList.add('selected');
    });
    weatherGroup.appendChild(btn);
  });
  weatherSection.appendChild(weatherGroup);
  body.appendChild(weatherSection);

  // 활동태그 + 태그별 메모
  const tagSection = document.createElement('div');
  tagSection.className = 'entry-section';
  tagSection.innerHTML = `<div class="entry-section-title">활동 태그 &amp; 내용</div>`;
  const tagsGroup = document.createElement('div');
  tagsGroup.className = 'tags-group';
  const tagMemoContainer = document.createElement('div');

function updateAffiliateBanner() {
  if (userSettings.plan === 'pro') return;
  const banner = document.getElementById('affiliate-banner');
  if (!banner) return;
  let ad = TAG_AD_MAP['default'];
  for (const tagId of entryData.tags) {
    const tag = userSettings.customTags.find(t => t.id === tagId);
    if (tag && TAG_AD_MAP[tag.label]) { ad = TAG_AD_MAP[tag.label]; break; }
  }
  banner.innerHTML = `
    <div class="affiliate-disclaimer">파트너 링크 · 광고 포함</div>
    <a class="affiliate-link" href="${ad.url}" target="_blank" rel="noopener noreferrer">${ad.label}</a>
  `;
}

function renderDonutChart(catExpenses, total) {
  const wrapper = document.getElementById('donut-wrapper');
  wrapper.innerHTML = '';

  const entries = Object.entries(catExpenses);
  if (total === 0 || entries.length === 0) {
    wrapper.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:12px 0;">지출 데이터가 없습니다.</div>';
    return;
  }

  const size = 120, cx = 60, cy = 60, R = 46, r = 28;
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);

  function polarToXY(angle, radius) {
    const rad = (angle - 90) * Math.PI / 180;
    return { x: cx + radius * Math.cos(rad), y: cy + radius * Math.sin(rad) };
  }
  function makeArcPath(s, e, oR, iR) {
    const large = (e - s) > 180 ? 1 : 0;
    const o1 = polarToXY(s, oR), o2 = polarToXY(e, oR);
    const i1 = polarToXY(e, iR), i2 = polarToXY(s, iR);
    return `M ${o1.x} ${o1.y} A ${oR} ${oR} 0 ${large} 1 ${o2.x} ${o2.y} L ${i1.x} ${i1.y} A ${iR} ${iR} 0 ${large} 0 ${i2.x} ${i2.y} Z`;
  }

  let cumAngle = 0;
  const legend = document.createElement('div');
  legend.className = 'donut-legend';

  entries.forEach(([cat, amt]) => {
    const pct = amt / total;
    const angle = pct * 360;
    const color = CAT_COLORS[cat] || '#888';
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', makeArcPath(cumAngle, cumAngle + angle, R, r));
    path.setAttribute('fill', color);
    svg.appendChild(path);
    cumAngle += angle;

    const li = document.createElement('div');
    li.className = 'legend-item';
    li.innerHTML = `
      <div class="legend-dot" style="background:${color}"></div>
      <span class="legend-label">${cat}</span>
      <span class="legend-pct">${Math.round(pct * 100)}%</span>
    `;
    legend.appendChild(li);
  });

  const text = document.createElementNS(svgNS, 'text');
  text.setAttribute('x', cx); text.setAttribute('y', cy + 5);
  text.setAttribute('text-anchor', 'middle');
  text.setAttribute('font-size', '10');
  text.setAttribute('fill', 'var(--text3)');
  text.textContent = formatWon(total);
  svg.appendChild(text);

  const svgWrap = document.createElement('div');
  svgWrap.className = 'donut-svg-wrap';
  svgWrap.appendChild(svg);
  wrapper.appendChild(svgWrap);
  wrapper.appendChild(legend);
}

function shortWon(amt) {
  if (amt === 0) return '';
  if (amt >= 10000) return (amt / 10000).toFixed(1) + '만';
  return Math.round(amt / 1000) + 'k';
}

function renderBarChart(monthlyExpenses, monthlyIncomes) {
  const container = document.getElementById('bar-chart');
  container.innerHTML = '';
  const incomes  = monthlyIncomes  || Array(12).fill(0);
  const maxAmt = Math.max(...monthlyExpenses, ...incomes, 1);
  const nowMonth = new Date().getMonth();
  const nowYear  = new Date().getFullYear();
  const isCurrent = currentYear === nowYear;

  monthlyExpenses.forEach((exp, mi) => {
    const inc = incomes[mi] || 0;
    const isNow = isCurrent && mi === nowMonth;
    const col = document.createElement('div');
    col.className = 'bar-col';

    const pair = document.createElement('div');
    pair.className = 'bar-pair';

    // Income bar
    const incWrap = document.createElement('div');
    incWrap.className = 'bar-fill-wrap';
    const incNum = document.createElement('div');
    incNum.className = 'bar-num income-num';
    incNum.textContent = shortWon(inc);
    const incFill = document.createElement('div');
    incFill.className = 'bar-fill income-bar' + (isNow ? ' current-month' : '');
    incFill.style.height = Math.round((inc / maxAmt) * 100) + '%';
    incWrap.appendChild(incNum);
    incWrap.appendChild(incFill);

    // Expense bar
    const expWrap = document.createElement('div');
    expWrap.className = 'bar-fill-wrap';
    const expNum = document.createElement('div');
    expNum.className = 'bar-num expense-num';
    expNum.textContent = shortWon(exp);
    const expFill = document.createElement('div');
    expFill.className = 'bar-fill' + (isNow ? ' current-month' : '');
    expFill.style.height = Math.round((exp / maxAmt) * 100) + '%';
    expWrap.appendChild(expNum);
    expWrap.appendChild(expFill);

    pair.appendChild(incWrap);
    pair.appendChild(expWrap);
    col.appendChild(pair);

    const labelEl = document.createElement('div');
    labelEl.className = 'bar-label';
    labelEl.textContent = mi + 1;
    col.appendChild(labelEl);
    container.appendChild(col);
  });
}
