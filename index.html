function exportJSON() {
  const data = { entries: allEntries, settings: userSettings, exportedAt: new Date().toISOString() };
  downloadBlob(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), `secondhouse-diary-${formatDate(new Date())}.json`);
  showToast('JSON 파일이 다운로드됩니다.');
}

function exportCSV() {
  const BOM = '\uFEFF';
  const headers = ['날짜','방문여부','날씨','태그','메모','지출합계','지출항목'];
  const rows = [headers.join(',')];
  Object.entries(allEntries).sort(([a],[b]) => a.localeCompare(b)).forEach(([dateStr, entry]) => {
    const tags = (entry.tags || []).map(id => userSettings.customTags.find(t => t.id === id)).filter(Boolean).map(t => t.emoji + t.label).join('|');
    const expTotal = getEntryTotal(entry);
    const expItems = (entry.expenses || []).map(ex => `${ex.name}:${ex.amount}(${ex.category})`).join('|');
    rows.push([dateStr, entry.visited ? '방문' : '미방문', entry.weather || '', tags, (entry.memo || '').replace(/,/g, '，').replace(/\n/g, ' '), expTotal, expItems].map(v => `"${v}"`).join(','));
  });
  downloadBlob(new Blob([BOM + rows.join('\n')], { type: 'text/csv;charset=utf-8;' }), `secondhouse-diary-${formatDate(new Date())}.csv`);
  showToast('CSV 파일이 다운로드됩니다.');
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.addEventListener('change', async () => {
    const file = input.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data.entries || typeof data.entries !== 'object') {
        showToast('올바른 형식의 JSON 파일이 아니에요.'); return;
      }
      // Merge entries (imported data wins on conflict)
      allEntries = { ...allEntries, ...data.entries };
      // Merge settings if present
      if (data.settings) {
        if (data.settings.customTags) userSettings.customTags = data.settings.customTags;
        if (data.settings.plan) userSettings.plan = data.settings.plan;
      }
      await Promise.all([
        dbSet(`users/${currentUser.uid}/entries`, allEntries),
        saveSettings(),
      ]);
      renderCalendar();
      closeSettingsModal();
      showToast(`✅ ${Object.keys(data.entries).length}건의 일지를 가져왔어요!`);
    } catch (e) {
      showToast('파일을 읽는 중 오류가 발생했어요.');
    }
  });
  input.click();
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}

document.getElementById('btn-open-search').addEventListener('click', () => {
  document.getElementById('search-overlay').classList.remove('hidden');
  document.getElementById('search-input').value = '';
  document.getElementById('search-results').innerHTML = '';
  setTimeout(() => document.getElementById('search-input').focus(), 50);
});
document.getElementById('btn-close-search').addEventListener('click', () => {
  document.getElementById('search-overlay').classList.add('hidden');
});
document.getElementById('search-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('search-overlay'))
    document.getElementById('search-overlay').classList.add('hidden');
});
document.getElementById('search-input').addEventListener('input', () => {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const resultsEl = document.getElementById('search-results');
  if (!q) { resultsEl.innerHTML = ''; return; }
  const matches = Object.entries(allEntries)
    .filter(([dateStr, entry]) => {
      if (dateStr.includes(q)) return true;
      if ((entry.memo || '').toLowerCase().includes(q)) return true;
      const tagLabels = (entry.tags || []).map(id => {
        const t = userSettings.customTags.find(t => t.id === id);
        return t ? (t.emoji + t.label).toLowerCase() : '';
      }).join(' ');
      if (tagLabels.includes(q)) return true;
      return false;
    })
    .sort(([a],[b]) => b.localeCompare(a))
    .slice(0, 30);

  if (!matches.length) {
    resultsEl.innerHTML = '<div class="search-no-result">검색 결과가 없습니다</div>';
    return;
  }
  resultsEl.innerHTML = '';
  matches.forEach(([dateStr, entry]) => {
    const item = document.createElement('div');
    item.className = 'search-result-item';
    const tags = (entry.tags || []).map(id => {
      const t = userSettings.customTags.find(t => t.id === id);
      return t ? t.emoji : '';
    }).join(' ');
    item.innerHTML = `<div class="search-result-date">${dateStr}${entry.visited ? ' ✅' : ''}</div>
      <div class="search-result-body">${tags} ${(entry.memo || '').slice(0, 60)}</div>`;
    item.addEventListener('click', () => {
      document.getElementById('search-overlay').classList.add('hidden');
      // Navigate to that month
      currentMonth = parseDate(dateStr);
      currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === 'calendar'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'tab-calendar'));
      renderCalendar();
      setTimeout(() => openEntryModal(dateStr), 100);
    });
    resultsEl.appendChild(item);
  });
});

function getFarmingData() {
  const custom = userSettings.customFarming?.[farmingRegion];
  if (custom) return custom;
  return JSON.parse(JSON.stringify(FARMING_DATA[farmingRegion] || FARMING_DATA.middle));

function saveFarmingData(data) {
  if (!userSettings.customFarming) userSettings.customFarming = {};
  userSettings.customFarming[farmingRegion] = data;
  saveSettings();
}

document.getElementById('btn-annual-prev').addEventListener('click', () => { currentAnnualYear--; renderAnnualTab(); });

function renderAnnualTab() {
  document.getElementById('annual-year-label').textContent = `${currentAnnualYear}년`;

  // Tag selector
  const tagSelect = document.getElementById('annual-tag-select');
  tagSelect.innerHTML = '';
  userSettings.customTags.sort((a,b) => a.order - b.order).forEach(tag => {
    const chip = document.createElement('button');
    chip.className = 'annual-tag-chip' + (annualActTag === tag.id ? ' active' : '');
    chip.textContent = tag.emoji + ' ' + tag.label;
    chip.addEventListener('click', () => {
      annualActTag = annualActTag === tag.id ? null : tag.id;
      renderAnnualTab();
    });
    tagSelect.appendChild(chip);
  });

  // 12-month grid
  const grid = document.getElementById('annual-act-grid');
  grid.className = 'annual-act-grid';
  grid.innerHTML = '';

  for (let mo = 0; mo < 12; mo++) {
    const card = document.createElement('div');
    card.className = 'annual-month-card';
    const title = document.createElement('div');
    title.className = 'annual-month-name';
    title.textContent = MONTH_NAMES[mo];
    card.appendChild(title);

    const entries = Object.entries(allEntries)
      .filter(([dateStr, entry]) => {
        const d = parseDate(dateStr);
        if (d.getFullYear() !== currentAnnualYear || d.getMonth() !== mo) return false;
        if (annualActTag && !(entry.tags || []).includes(annualActTag)) return false;
        const hasTagMemo = entry.tagMemos && Object.values(entry.tagMemos).some(v => v);
        return entry.visited || (entry.tags && entry.tags.length) || entry.memo || hasTagMemo;
      })
      .sort(([a],[b]) => a.localeCompare(b));

    if (!entries.length) {
      const empty = document.createElement('div');
      empty.className = 'annual-month-empty';
      empty.textContent = '기록 없음';
      card.appendChild(empty);
    } else {
      entries.forEach(([dateStr, entry]) => {
        const row = document.createElement('div');
        row.className = 'annual-month-entry';
        const d = parseDate(dateStr);

        let lines = [];
        if (annualActTag) {
          // 특정 태그 필터: 해당 태그 메모 표시
          const t = userSettings.customTags.find(t => t.id === annualActTag);
          const tagMemo = entry.tagMemos?.[annualActTag] || '';
          const label = t ? `${t.emoji} ` : '';
          if (tagMemo) lines.push(label + tagMemo);
          if (entry.memo) lines.push(entry.memo);
        } else {
          // 전체: 태그별 메모 + 전체 메모 모두 표시
          (entry.tags || []).forEach(tid => {
            const t = userSettings.customTags.find(t => t.id === tid);
            const m = entry.tagMemos?.[tid];
            if (t && m) lines.push(`${t.emoji} ${m}`);
          });
          if (entry.memo) lines.push(entry.memo);
        }

        const dateLabel = document.createElement('span');
        dateLabel.style.cssText = 'font-weight:700;color:var(--primary);margin-right:4px;';
        dateLabel.textContent = d.getDate() + '일';
        row.appendChild(dateLabel);

        if (lines.length) {
          const content = document.createElement('span');
          content.textContent = lines.map(l => l.slice(0, 30)).join(' / ');
          row.appendChild(content);
        }

        row.style.cursor = 'pointer';
        row.addEventListener('click', () => openEntryModal(dateStr));
        card.appendChild(row);
      });
    }
    grid.appendChild(card);
  }
}

  try {
    if (!demoMode && db) {
      const snap = await get(child(dbRef(db), 'reviews'));
      reviewsData = snap.exists() ? snap.val() : {};
    } else {
      reviewsData = {};
      Object.keys(localStorage).filter(k => k.startsWith('shd_review__')).forEach(k => {
        try {
          const id = k.slice('shd_review__'.length);
          reviewsData[id] = JSON.parse(localStorage.getItem(k));
        } catch(e) {}
      });
    }
  } catch(e) {
    reviewsData = {};
  }
}

function starsHtml(rating) {
  return Array.from({ length: 5 }, (_, i) => `<span style="color:${i < rating ? '#f59e0b' : '#d1d5db'}">★</span>`).join('');
}

function renderReviews() {
  const list = document.getElementById('review-list');
  const empty = document.getElementById('review-empty');
  const writeArea = document.getElementById('review-write-area');
  if (!list) return;

  // Write button (logged-in users)
  if (writeArea) {
    const myKey = currentUser ? Object.keys(reviewsData).find(k => reviewsData[k].uid === currentUser.uid) : null;
    writeArea.innerHTML = '';
    if (currentUser) {
      const btn = document.createElement('button');
      btn.className = 'btn-write-review';
      btn.textContent = myKey ? '내 후기 수정' : '+ 후기 작성';
      btn.addEventListener('click', () => openReviewModal(myKey || null));
      writeArea.appendChild(btn);
    }
  }

  const entries = Object.entries(reviewsData)
    .filter(([,r]) => r && typeof r === 'object')
    .sort(([,a],[,b]) => b.createdAt - a.createdAt);

  if (!entries.length) { empty.style.display = 'block'; list.innerHTML = ''; return; }
  empty.style.display = 'none';
  list.innerHTML = entries.map(([id, r]) => `
    <div class="review-card">
      <div class="review-card-header">
        <span class="review-author">${escapeHtml(r.displayName || '익명')}</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="review-stars">${starsHtml(r.rating)}</span>
          ${(currentUser && r.uid === currentUser.uid) ? `<button class="review-del-btn" onclick="deleteReview('${id}')">삭제</button>` : ''}
        </div>
      </div>
      <div class="review-body" style="white-space:pre-wrap;">${linkifyText(r.body)}</div>
      <div class="review-date">${formatNoticeDate(r.createdAt)}</div>
    </div>
  `).join('');
}

let reviewRating = 0;

function openReviewModal(existingId) {
  reviewRating = existingId ? (reviewsData[existingId]?.rating || 0) : 0;
  document.getElementById('review-body-input').value = existingId ? (reviewsData[existingId]?.body || '') : '';
  updateStarDisplay();
  document.getElementById('review-modal-overlay').classList.remove('hidden');
  document.getElementById('btn-review-submit').dataset.editId = existingId || '';
}

function updateStarDisplay() {
  document.querySelectorAll('.star-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', i < reviewRating);
  });
}

document.querySelectorAll('.star-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    reviewRating = Number(btn.dataset.val);
    updateStarDisplay();
  });
  btn.addEventListener('mouseover', () => {
    const hval = Number(btn.dataset.val);
    document.querySelectorAll('.star-btn').forEach((b, i) => b.classList.toggle('hover', i < hval));
  });
  btn.addEventListener('mouseout', () => {
    document.querySelectorAll('.star-btn').forEach(b => b.classList.remove('hover'));
  });
});

document.getElementById('btn-review-cancel').addEventListener('click', () => {
  document.getElementById('review-modal-overlay').classList.add('hidden');
});

document.getElementById('btn-review-submit').addEventListener('click', async () => {
  const body = document.getElementById('review-body-input').value.trim();
  if (!reviewRating) { showToast('별점을 선택해 주세요.'); return; }
  if (!body) { showToast('내용을 입력해 주세요.'); return; }
  const editId = document.getElementById('btn-review-submit').dataset.editId;
  const id = editId || ('review_' + currentUser.uid + '_' + Date.now());
  const review = {
    uid: currentUser.uid,
    displayName: currentUser.displayName || '익명',
    rating: reviewRating,
    body,
    createdAt: editId ? (reviewsData[editId]?.createdAt || Date.now()) : Date.now(),
  };
  try {
    if (!demoMode && db) {
      await set(dbRef(db, 'reviews/' + id), review);
    } else {
      localStorage.setItem('shd_review__' + id, JSON.stringify(review));
    }
    reviewsData[id] = review;
    document.getElementById('review-modal-overlay').classList.add('hidden');
    renderReviews();
    showToast(editId ? '후기가 수정됐어요.' : '후기가 등록됐어요! ⭐');
  } catch(e) { showToast('저장에 실패했어요.'); }
});

async function deleteReview(id) {
  if (!confirm('후기를 삭제할까요?')) return;
  delete reviewsData[id];
  renderReviews();
  if (!demoMode && db) {
    try { await remove(dbRef(db, 'reviews/' + id)); }
    catch(e) { await loadReviews(); renderReviews(); showToast('삭제 실패'); return; }
  } else {
    localStorage.removeItem('shd_review__' + id);
  }
  showToast('후기가 삭제됐어요.');
}
window.deleteReview = deleteReview;

// Board sub-tab switching
document.querySelectorAll('.board-subtab-btn').forEach(btn => {
  btn.addEventListener('click', () => {

    document.getElementById('board-review-panel').style.display = boardSubTab === 'review' ? '' : 'none';

});

// ─────────────────────────────────────────────
//  Notice Board
// ─────────────────────────────────────────────
const ADMIN_EMAIL = 'kjj0708@gmail.com';
let noticesData = {};

function isAdmin() {
  if (!currentUser) return false;
  if (currentUser.email === ADMIN_EMAIL) return true;
  // Allow demo admin for testing
  if (demoMode && currentUser.uid === 'demo') return true;
  return false;
}

async function loadNotices() {
  try {
    if (!demoMode && db) {
      const snap = await get(child(dbRef(db), 'notices'));
      noticesData = snap.exists() ? snap.val() : {};
    } else {
      noticesData = {};
    }
  } catch (e) {
    noticesData = {};
  }
  renderNotices();
}

function renderNotices() {
  const list = document.getElementById('notice-list');
  const empty = document.getElementById('notice-empty');
  const writeBtn = document.getElementById('btn-write-notice');
  if (writeBtn) writeBtn.style.display = isAdmin() ? 'block' : 'none';

  const entries = Object.entries(noticesData)
    .filter(([,n]) => n && typeof n === 'object')
    .sort(([,a],[,b]) => (b.pinned?1:0)-(a.pinned?1:0) || b.createdAt-a.createdAt);

  if (entries.length === 0) { empty.style.display='block'; list.innerHTML=''; return; }
  empty.style.display = 'none';

  list.innerHTML = entries.map(([id, n]) => `
    <div class="notice-card${n.pinned?' pinned':''}" id="nc-${id}">
      <div class="notice-card-header" onclick="toggleNotice('${id}')">
        ${n.pinned?'<span class="notice-pin-badge">📌 고정</span>':''}
        <div class="notice-title">${escapeHtml(n.title)}</div>
        <span class="notice-date-inline">${formatNoticeDate(n.createdAt)}</span>
        <svg class="notice-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="notice-body-wrap">
        <div class="notice-body" style="white-space:pre-wrap;line-height:1.7;">${linkifyText(n.body)}</div>
        ${(n.images||[]).length ? `<div class="notice-images">${(n.images||[]).map((src,i)=>`<img class="notice-img" src="${src}" onclick="openLightbox('${id}',${i})" />`).join('')}</div>` : ''}
        ${isAdmin() ? `
        <div class="notice-admin-btns">
          <button class="btn-notice-edit" onclick="openEditNotice('${id}')">✏️ 수정</button>
          <button class="btn-notice-del" onclick="showDelConfirm('${id}')">🗑 삭제</button>
        </div>
        <div class="notice-del-confirm" id="del-confirm-${id}">
          <span>정말 삭제할까요?</span>
          <button class="btn-del-no" onclick="hideDelConfirm('${id}')">취소</button>
          <button class="btn-del-yes" onclick="deleteNotice('${id}')">삭제</button>
        </div>` : ''}
      </div>
    </div>
  `).join('');
}

function toggleNotice(id) {
  const card = document.getElementById('nc-'+id);
  if (card) card.classList.toggle('open');
}
function showDelConfirm(id) { document.getElementById('del-confirm-'+id)?.classList.add('show'); }
function hideDelConfirm(id) { document.getElementById('del-confirm-'+id)?.classList.remove('show'); }

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function linkifyText(str) {
  const escaped = escapeHtml(str);
  return escaped.replace(/(https?:\/\/[^\s<>"{}|\\^[\]`]+)/g,
    '<a href="$1" target="_blank" rel="noopener noreferrer" class="auto-link">$1</a>');
}
function formatNoticeDate(ts) {
  const d=new Date(ts);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

async function deleteNotice(id) {
  if (!isAdmin()) return;
  // Optimistic: remove locally first so UI always updates
  delete noticesData[id];
  renderNotices();
  if (!demoMode && db) {
    try {
      await remove(dbRef(db, 'notices/'+id));
    } catch(e) {
      console.error('Notice delete failed:', e);
      // Reload from server to restore correct state
      await loadNotices();
      showToast('삭제에 실패했어요. (' + (e.code || e.message) + ')');
      return;
    }
  }
  showToast('공지사항이 삭제됐어요.');
}

// Image resize
function resizeImage(file, maxW=1200) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Modal state
let editingNoticeId = null;
let pendingImages = []; // base64 strings

function openNoticeModal(noticeId) {
  editingNoticeId = noticeId || null;
  pendingImages = [];
  const n = noticeId ? noticesData[noticeId] : null;
  document.getElementById('notice-modal-title').textContent = noticeId ? '공지사항 수정' : '공지사항 작성';
  document.getElementById('notice-title-input').value = n ? n.title : '';
  document.getElementById('notice-body-input').value = n ? n.body : '';
  document.getElementById('notice-pin-check').checked = n ? !!n.pinned : false;
  document.getElementById('btn-notice-submit').textContent = noticeId ? '수정 완료' : '등록';
  if (n && n.images) pendingImages = [...n.images];
  renderImgPreviews();
  document.getElementById('notice-modal-overlay').classList.remove('hidden');
}

function openEditNotice(id) { openNoticeModal(id); }

function renderImgPreviews() {
  const wrap = document.getElementById('notice-img-previews');
  wrap.innerHTML = pendingImages.map((src,i) => `
    <div class="notice-img-preview-wrap">
      <img src="${src}" />
      <button class="notice-img-remove" onclick="removeImg(${i})">✕</button>
    </div>
  `).join('');
}
function removeImg(i) { pendingImages.splice(i,1); renderImgPreviews(); }

document.getElementById('notice-img-input').addEventListener('change', async e => {
  const files = Array.from(e.target.files).slice(0, 3 - pendingImages.length);
  for (const f of files) {
    if (pendingImages.length >= 3) break;
    const b64 = await resizeImage(f);
    pendingImages.push(b64);
  }
  renderImgPreviews();
  e.target.value = '';
});

document.getElementById('btn-write-notice').addEventListener('click', () => openNoticeModal(null));
document.getElementById('btn-notice-cancel').addEventListener('click', () => {
  document.getElementById('notice-modal-overlay').classList.add('hidden');
});
document.getElementById('btn-notice-submit').addEventListener('click', async () => {
  const title = document.getElementById('notice-title-input').value.trim();
  const body = document.getElementById('notice-body-input').value.trim();
  const pinned = document.getElementById('notice-pin-check').checked;
  if (!title) { showToast('제목을 입력해 주세요.'); return; }
  if (!body) { showToast('내용을 입력해 주세요.'); return; }
  const id = editingNoticeId || ('notice_' + Date.now());
  const createdAt = editingNoticeId ? (noticesData[id]?.createdAt || Date.now()) : Date.now();
  const notice = { title, body, pinned, createdAt, images: pendingImages };
  try {
    if (!demoMode && db) await set(dbRef(db, 'notices/'+id), notice);
    noticesData[id] = notice;
    document.getElementById('notice-modal-overlay').classList.add('hidden');
    renderNotices();
    showToast(editingNoticeId ? '공지사항이 수정됐어요.' : '공지사항이 등록됐어요! 📢');
  } catch(e) { showToast('저장에 실패했어요.'); }
});

// Lightbox
const lightboxData = {};
function openLightbox(noticeId, idx) {
  const imgs = noticesData[noticeId]?.images || [];
  document.getElementById('img-lightbox-img').src = imgs[idx] || '';
  document.getElementById('img-lightbox').classList.remove('hidden');
}
document.getElementById('img-lightbox-close').addEventListener('click', () => {
  document.getElementById('img-lightbox').classList.add('hidden');
});
document.getElementById('img-lightbox').addEventListener('click', e => {
  if (e.target === e.currentTarget) document.getElementById('img-lightbox').classList.add('hidden');
});

// Expose notice functions to global scope (required for inline onclick in module script)
window.toggleNotice  = toggleNotice;
window.showDelConfirm = showDelConfirm;
window.hideDelConfirm = hideDelConfirm;
window.deleteNotice  = deleteNotice;
window.openEditNotice = openEditNotice;
window.openLightbox  = openLightbox;
window.removeImg     = removeImg;
